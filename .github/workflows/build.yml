name: build-hummer-sukisu-builtin-new-susfs

on:
  workflow_dispatch:
    inputs:
      enable_kpm:
        description: "Enable KPM; automatically retry without KPM if compilation fails"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hummer-sukisu-builtin-new-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    defaults:
      run:
        shell: bash

    env:
      KERNEL_BRANCH: "17.0"
      SUSFS_BRANCH: "gki-android15-6.6"
      SUKISU_BRANCH: "builtin-new"
      SUKISU_REPO: "https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
      LLVM_VERSION: "22.1.0"

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout device configuration
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          test -f device.config

          sudo apt-get update

          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            dwarves pahole \
            zip git curl \
            xz-utils build-essential \
            python3 python3-pip \
            cpio rsync kmod \
            libncurses-dev \
            lz4 zstd

      # ==========================================
      # 2. LLVM 22
      # ==========================================

      - name: Fetch LLVM toolchain
        run: |
          set -euxo pipefail

          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o /tmp/llvm.tar.xz \
            "$LLVM_URL"

          mkdir -p "$HOME/llvm"

          tar -xJf /tmp/llvm.tar.xz \
            --no-same-owner \
            -C "$HOME/llvm" \
            --strip-components=1

          export PATH="$HOME/llvm/bin:$PATH"

          clang --version
          ld.lld --version
          llvm-nm --version

      # ==========================================
      # 3. Kernel sources
      # ==========================================

      - name: Fetch kernel sources
        run: |
          set -euxo pipefail

          mkdir -p ws

          git clone \
            --branch "$KERNEL_BRANCH" \
            --single-branch \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750 \
            ws/common

          git clone \
            --branch "$KERNEL_BRANCH" \
            --single-branch \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-modules \
            ws/sm8750-modules

          git clone \
            --branch "$KERNEL_BRANCH" \
            --single-branch \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-devicetrees \
            ws/sm8750-devicetrees

          echo "================================"
          echo "KERNEL SOURCE INFORMATION"
          echo "================================"

          for repo in common sm8750-modules sm8750-devicetrees; do
            echo "=== $repo ==="
            git -C "ws/$repo" rev-parse HEAD
            git -C "ws/$repo" log -1 --format="%ci %s"
          done

          echo "=== Kernel version ==="

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
            ws/common/Makefile

          echo "=== Kernel branch ==="

          git -C ws/common branch --show-current


      # ==========================================
      # 4. SUSFS integration
      # ==========================================

      - name: Integrate SUSFS
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Fetch SUSFS ==="

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            ../susfs

          echo "=== SUSFS version ==="

          grep -m1 'SUSFS_VERSION' \
            ../susfs/kernel_patches/include/linux/susfs.h

          echo "=== SUSFS commit ==="

          git -C ../susfs rev-parse HEAD

          # Copy SUSFS implementation

          cp ../susfs/kernel_patches/fs/susfs.c fs/

          cp \
            ../susfs/kernel_patches/include/linux/susfs.h \
            ../susfs/kernel_patches/include/linux/susfs_def.h \
            include/linux/

          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

          echo "=== Apply SUSFS kernel patch ==="

          patch --batch -p1 --forward \
            < ../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch

          if find . -name "*.rej" -print -quit | grep -q .; then
            echo "FATAL: SUSFS patch rejected"

            find . -name "*.rej" -exec sh -c \
              'echo "--- $1"; cat "$1"' _ {} \;

            exit 1
          fi

          echo "=== Verify SUSFS integration ==="

          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

          grep -q 'susfs_is_avc_log_spoofing_enabled' \
            security/selinux/avc.c

          grep -q 'susfs_ksu_sid' \
            security/selinux/avc.c

          grep -q 'susfs_priv_app_sid' \
            security/selinux/avc.c

          grep -q 'susfs_set_avc_log_spoofing' \
            fs/susfs.c

          echo "SUSFS integration passed"

      # ==========================================
      # 5. SukiSU builtin-new
      # ==========================================

      - name: Integrate SukiSU builtin-new
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Verify remote branch ==="

          git ls-remote --exit-code --heads \
            "$SUKISU_REPO" \
            "refs/heads/$SUKISU_BRANCH"

          echo "=== Clone exact branch ==="

          test ! -e KernelSU

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$SUKISU_BRANCH" \
            "$SUKISU_REPO" \
            KernelSU

          ACTUAL_BRANCH=$(git -C KernelSU branch --show-current)
          ACTUAL_COMMIT=$(git -C KernelSU rev-parse HEAD)

          echo "Branch: $ACTUAL_BRANCH"
          echo "Commit: $ACTUAL_COMMIT"

          test "$ACTUAL_BRANCH" = "$SUKISU_BRANCH"

          echo "=== Verify branch Kconfig ==="

          grep -q '^config KSU_SUSFS$' \
            KernelSU/kernel/Kconfig

          grep -q '^config KSU_SUSFS_INLINE_HOOK$' \
            KernelSU/kernel/Kconfig

          grep -q '^config KPM$' \
            KernelSU/kernel/Kconfig

          echo "=== Integrate into drivers ==="

          test -d drivers
          test -f drivers/Makefile
          test -f drivers/Kconfig

          test ! -e drivers/kernelsu
          test ! -L drivers/kernelsu

          ln -s ../KernelSU/kernel drivers/kernelsu

          if ! grep -Fq \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile; then

            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> drivers/Makefile
          fi

          if ! grep -Fq \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/Kconfig")
          data = p.read_text()

          pos = data.rfind("endmenu")

          if pos < 0:
              raise SystemExit("FATAL: drivers/Kconfig endmenu missing")

          entry = 'source "drivers/kernelsu/Kconfig"\n\n'

          data = data[:pos] + entry + data[pos:]
          p.write_text(data)
          PY

          fi

          echo "=== Verify integration ==="

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/ksu.c

          readlink -f drivers/kernelsu

          grep -F \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -F \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          echo "SukiSU builtin-new integration passed"

      # ==========================================
      # 6. SELinux compatibility
      # ==========================================

      - name: Verify SukiSU SELinux implementation
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          FILE=KernelSU/kernel/selinux/rules.c

          test -s "$FILE"

          echo "=== Verify policy update implementation ==="

          grep -n \
            'pol->latest_granting = old_pol->latest_granting + 1' \
            "$FILE"

          echo "=== Verify SUSFS SID refresh ==="

          grep -n \
            'susfs_set_batch_sid' \
            "$FILE"

          echo "=== Reject stale compatibility code ==="

          if grep -n 'seqno0' "$FILE"; then
            echo "FATAL: stale seqno0 reference"
            exit 1
          fi

          echo "SELinux implementation verified"

      # ==========================================
      # 7. Native AVC spoofing
      # ==========================================

      - name: Verify Native AVC Spoofing
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Verify AVC implementation ==="

          AVC=security/selinux/avc.c
          SUSFS=fs/susfs.c
          HEADER=include/linux/susfs.h
          RULES=KernelSU/kernel/selinux/rules.c

          test -s "$AVC"
          test -s "$SUSFS"
          test -s "$HEADER"
          test -s "$RULES"

          grep -n \
            'susfs_is_avc_log_spoofing_enabled' \
            "$AVC"

          grep -n 'susfs_ksu_sid' "$AVC"
          grep -n 'susfs_priv_app_sid' "$AVC"

          echo "=== Verify static key ==="

          grep -n \
            'DEFINE_STATIC_KEY_FALSE(susfs_is_avc_log_spoofing_enabled)' \
            "$SUSFS"

          echo "=== Verify AVC control interface ==="

          grep -n 'susfs_set_avc_log_spoofing' \
            "$SUSFS"

          grep -n 'susfs_set_avc_log_spoofing' \
            "$HEADER"

          echo "=== Verify SELinux SID refresh ==="

          grep -n 'susfs_set_batch_sid' "$RULES"

          echo "=== Verify manager command integration ==="

          grep -R -n \
            'susfs_set_avc_log_spoofing' \
            KernelSU/kernel

          echo "Native AVC Spoofing implementation verified"

          
      # ==========================================
      # 8. Lock SELinux to permissive
      # ==========================================

      - name: Lock SELinux to permissive
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          FILE=security/selinux/selinuxfs.c
          test -s "$FILE"

          echo "=== Before patch ==="

          test "$(grep -c 'new_value = !!scan_value;' "$FILE")" = "1"
          grep -n 'new_value = !!scan_value;' "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("security/selinux/selinuxfs.c")
          s = p.read_text()

          anchor = "\tnew_value = !!scan_value;\n"

          if s.count(anchor) != 1:
              raise SystemExit("FATAL: anchor count = %d" % s.count(anchor))

          inject = anchor + (
              "\n"
              "\t/*\n"
              "\t * Local hardening: never allow a runtime switch into enforcing mode.\n"
              "\t * Return count (pretend success) instead of -EPERM so that a stock\n"
              "\t * init which calls setenforce(1) will not PLOG(FATAL) and hang boot.\n"
              "\t * The kernel state simply stays permissive.\n"
              "\t */\n"
              "\tif (new_value) {\n"
              "\t\tpr_info(\"SELinux: runtime switch to enforcing blocked\\n\");\n"
              "\t\tlength = count;\n"
              "\t\tgoto out;\n"
              "\t}\n"
          )

          if "runtime switch to enforcing blocked" not in s:
              s = s.replace(anchor, inject, 1)

          p.write_text(s)
          PY

          echo "=== After patch ==="

          grep -n -A12 'Local hardening: never allow' "$FILE"

          test "$(grep -c 'runtime switch to enforcing blocked' "$FILE")" = "1"

          echo "=== enclosing function ==="

          awk '/static ssize_t sel_write_enforce/,/^#else/' "$FILE" \
            | grep -E 'new_value = !!|runtime switch|length = count|goto out|enforcing_set|^out:'

          echo "SELinux permissive lock applied"


      # ==========================================
      # 8. Configure kernel
      # ==========================================

      - name: Configure kernel
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          WARN_COUNT=0
          CONTAINER_MISSING=0

          cp "${{ github.workspace }}/device.config" .config

          echo "=== Remove conflicting KSU/KPM definitions ==="

          # Keep the original behaviour for the KSU/KPM family (the build
          # re-adds every key it needs later).
          sed -i -E \
            '/^(CONFIG_(KSU|KPM)(_[A-Z0-9_]+)?=|# CONFIG_(KSU|KPM)(_[A-Z0-9_]+)? is not set)/d' \
            .config

          echo "=== Drop only the keys we are about to flip to =y ==="

          # Minimal intervention: if device.config explicitly disables a key
          # that this build enables, remove that "is not set" line so the
          # appended "=y" is the single definition for that symbol.
          # Every other line in device.config is left untouched.

          FLIP_KEYS="DEVTMPFS SECURITY_SELINUX_DEVELOP SECURITY_SELINUX_BOOTPARAM"

          FLIPPED=0
          for k in $FLIP_KEYS; do
            if grep -qx "# CONFIG_${k} is not set" .config; then
              sed -i "/^# CONFIG_${k} is not set$/d" .config
              echo "  dropped stale: # CONFIG_${k} is not set"
              FLIPPED=$((FLIPPED + 1))
            fi
          done
          echo "  total dropped: ${FLIPPED}"

          echo "  .config lines kept from device.config: $(wc -l < .config)"

          echo "=== Write base + container configuration ==="

          BEFORE=$(wc -l < .config)
          echo "  .config lines before append: ${BEFORE}"

          cat >> .config <<'CFG_BASE_EOF'
          # Architecture
          CONFIG_64BIT=y
          CONFIG_ARM64=y

          # Security: keep SELinux compiled in with stock enforcing default.
          # Do NOT set CONFIG_SECURITY_SELINUX_DISABLE=y: init will panic on boot.
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          # DEVELOP=y only allows runtime setenforce 0/1; boot default stays enforcing.
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_EXT4_FS=y

          # Debugging and symbols
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # ==========================================
          # Minimal single addition: devtmpfs only
          # ==========================================
          # Hardware access toggle in the container manager reads CONFIG_DEVTMPFS.
          #
          # Deliberately NOT set:
          #   CONFIG_DEVTMPFS_MOUNT=y
          #     Makes the kernel auto-mount devtmpfs on /dev during boot. Android's
          #     first-stage init already mounts /dev itself. Two mechanisms racing
          #     for the same mount is a needless variable when chasing a boot hang.
          #     Older Droidspaces (<5.9.5) wants it; >=5.9.5 does not.
          #   CONFIG_NAMESPACES / CONFIG_USER_NS
          #     Container sandbox toggle. Changes cred/nsproxy layout.
          #   CONFIG_OVERLAY_FS
          #     Container image layers.
          #   CONFIG_SECCOMP / CONFIG_SECCOMP_FILTER
          #     Already =y in the stock crDroid kernel - setting them adds nothing.

          CONFIG_DEVTMPFS=y
          CFG_BASE_EOF

          AFTER_BASE=$(wc -l < .config)
          echo "  .config lines after base append: ${AFTER_BASE} (delta +$((AFTER_BASE-BEFORE)))"

          echo "=== Write SukiSU configuration ==="

          cat >> .config <<'CFG_KSU_EOF'
          # SukiSU Ultra
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_FEATURE_SULOG=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_ENABLE_FULL_UID_CHECKS=y

          # SUSFS core
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_INLINE_HOOK=y

          # SUSFS features
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CFG_KSU_EOF

          echo "=== KPM toggle ==="

          if [ "${{ inputs.enable_kpm }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> .config
          else
            echo "# CONFIG_KPM is not set" >> .config
          fi

          echo "=== Disable automatic git suffix ==="

          # Original script only matched the "=y" form, so if device.config
          # already carried "# CONFIG_LOCALVERSION_AUTO is not set" this was
          # a no-op and the release could still gain a -g<hash> suffix,
          # breaking KSU version matching. Handle both forms explicitly.
          sed -i \
            -e 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' \
            .config

          if grep -qx 'CONFIG_LOCALVERSION_AUTO=y' .config; then
            sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config
          fi

          echo "  LOCALVERSION_AUTO state:"
          grep -E 'LOCALVERSION_AUTO' .config || echo "  (absent)"

          AFTER_KSU=$(wc -l < .config)
          echo "  .config lines after KSU append: ${AFTER_KSU} (delta +$((AFTER_KSU-BEFORE)))"

          echo "=== Resolve Kconfig dependencies ==="

          make olddefconfig

          AFTER_OLD=$(wc -l < .config)
          echo "  .config lines after olddefconfig: ${AFTER_OLD}"
          echo "  (a large drop here means olddefconfig dropped unsupported symbols)"

          echo "=== Verify appended keys survived olddefconfig ==="

          SURVIVED=0
          DROPPED=0
          # Only the keys this build actually appends.
          for c in 64BIT ARM64 SECURITY SECURITY_SELINUX SECURITY_SELINUX_DEVELOP SECURITY_SELINUX_BOOTPARAM EXT4_FS DEBUG_KERNEL KALLSYMS KALLSYMS_ALL DEVTMPFS; do
            if grep -qx "CONFIG_${c}=y" .config; then
              SURVIVED=$((SURVIVED + 1))
            else
              echo "  DROPPED: CONFIG_${c}"
              DROPPED=$((DROPPED + 1))
            fi
          done
          echo "  survived: ${SURVIVED} / dropped: ${DROPPED}"
          echo "=== Verify required base + SukiSU configuration ==="

          for c in \
          64BIT \
          SECURITY \
          SECURITY_SELINUX \
          EXT4_FS \
          DEBUG_KERNEL \
          KALLSYMS \
          KALLSYMS_ALL \
          KSU \
          KSU_LSM_SECURITY_HOOKS \
          KSU_SUSFS \
          KSU_SUSFS_INLINE_HOOK \
          KSU_SUSFS_SUS_PATH \
          KSU_SUSFS_SUS_MOUNT \
          KSU_SUSFS_SUS_KSTAT \
          KSU_SUSFS_SPOOF_UNAME \
          KSU_SUSFS_ENABLE_LOG \
          KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          KSU_SUSFS_OPEN_REDIRECT \
          KSU_SUSFS_SUS_MAP \
          KSU_SUSFS_PRIORITY_UID_FILTER; do

          if grep -qx "CONFIG_${c}=y" .config; then
          echo "OK: CONFIG_${c}=y"
          else
          echo "WARN: CONFIG_${c} is not enabled (build continues)"
          grep -E \
          "^CONFIG_${c}=|^# CONFIG_${c} is not set" \
          .config || true
          WARN_COUNT=$((WARN_COUNT + 1))
          fi
          done

          echo "=== Verify branch-optional SukiSU features ==="

          # SULOG / ADBROOT / FULL_UID_CHECKS 是分支相关选项。
          # builtin-new 分支的 Kconfig 里没有 KSU_FEATURE_SULOG
          # （已核实: 只有 ADBROOT 和 FULL_UID_CHECKS）。
          # 因此: Kconfig 有 -> 严格校验; 没有 -> 放行，不影响 SUSFS/AVC 链路。
          KSU_KCONFIG=KernelSU/kernel/Kconfig

          if [ ! -f "$KSU_KCONFIG" ]; then
            echo "WARN: $KSU_KCONFIG not found, skip optional feature verification"
          fi

          for c in KSU_FEATURE_SULOG KSU_FEATURE_ADBROOT KSU_ENABLE_FULL_UID_CHECKS; do

            if grep -qE "^config[[:space:]]+${c}[[:space:]]*$" "$KSU_KCONFIG"; then

              if grep -qx "CONFIG_${c}=y" .config; then
                echo "OK: CONFIG_${c}=y (declared)"
              else
                echo "WARN: CONFIG_${c} declared in Kconfig but not enabled (build continues)"
                grep -E "^CONFIG_${c}=|^# CONFIG_${c} is not set" .config || true
                WARN_COUNT=$((WARN_COUNT + 1))
              fi

            else

              echo "SKIP: ${c} not in this branch Kconfig (compiled out, SUSFS/AVC unaffected)"

            fi

          done

          echo "=== Verify hardware access config ==="

          CONTAINER_MISSING=0

          # Single addition in this build: CONFIG_DEVTMPFS.
          # DEVTMPFS_MOUNT is intentionally absent (see comment above).
          if grep -qx "CONFIG_DEVTMPFS=y" .config; then
          echo "OK: CONFIG_DEVTMPFS=y"
          else
          echo "WARN: CONFIG_DEVTMPFS not enabled after olddefconfig"
          CONTAINER_MISSING=$((CONTAINER_MISSING + 1))
          WARN_COUNT=$((WARN_COUNT + 1))
          fi

          if grep -qx "CONFIG_DEVTMPFS_MOUNT=y" .config; then
          echo "NOTE: CONFIG_DEVTMPFS_MOUNT=y (came from device.config, not added by us)"
          else
          echo "OK: CONFIG_DEVTMPFS_MOUNT unset (Android init handles /dev)"
          fi

          for c in NAMESPACES USER_NS OVERLAY_FS VETH CGROUPS; do
          echo "INFO: CONFIG_${c} not managed by this build"
          done

          echo "Container soft warnings: ${CONTAINER_MISSING}"

          echo "=== Verify KPM configuration ==="

          if [ "${{ inputs.enable_kpm }}" = "true" ]; then
          grep -qx 'CONFIG_KPM=y' .config
          echo "KPM requested and enabled"
          else
          ! grep -qx 'CONFIG_KPM=y' .config
          echo "KPM disabled by request"
          fi

          echo "=== Verify SukiSU hook backend ==="

          grep -qx 'CONFIG_KSU_SUSFS=y' .config
          grep -qx 'CONFIG_KSU_SUSFS_INLINE_HOOK=y' .config

          if grep -qx 'CONFIG_KSU_KPROBES_KSUD=y' .config; then
          echo "WARN: KSU Kprobes backend enabled (unexpected, build continues)"
          WARN_COUNT=$((WARN_COUNT + 1))
          fi

          echo "SUSFS inline hook backend selected"

          echo "=== Global KPROBES status ==="

          grep -E \
          '^CONFIG_KPROBES=|^# CONFIG_KPROBES is not set' \
          .config || true

          echo "=== Kernel release ==="

          make -s kernelrelease

          echo ""
          echo "=============================================="
          echo "CONFIGURATION SUMMARY"
          echo "=============================================="
          echo "  build variant          : container batch 1 of 3"
          echo "  soft warnings          : ${WARN_COUNT}"
          echo "  container missing items: ${CONTAINER_MISSING}"
          echo "  (warnings do NOT stop the build - image will still be produced)"
          echo ""

          if [ "$WARN_COUNT" -gt 0 ]; then
            echo "NOTE: ${WARN_COUNT} warning(s) above. Review before flashing."
          else
            echo "All checked items present."
          fi

          echo "=== devtmpfs / container config snapshot ==="

          grep -E \
            '^CONFIG_(DEVTMPFS|DEVTMPFS_MOUNT|NAMESPACES|USER_NS|OVERLAY_FS|SECCOMP|SECCOMP_FILTER|CGROUPS|CGROUP_PIDS|CFS_BANDWIDTH|IPV6|IP6_NF_NAT|VETH|BRIDGE)=' \
            .config || true

          echo "=== config diff vs device.config baseline ==="

          if [ -f "${{ github.workspace }}/device.config" ]; then
            diff <(sort "${{ github.workspace }}/device.config") <(sort .config) \
              | grep -E '^[<>]' | grep -E 'CONFIG_(NAMESPACES|USER_NS|PID_NS|IPC_NS|NET_NS|CGROUPS|CGROUP_PIDS|CFS_BANDWIDTH|MEMCG|DEVTMPFS|OVERLAY_FS|SECCOMP|VETH|BRIDGE|NF_NAT|IPV6|SELINUX)' \
              || echo "  (no differences in the tracked keys)"
          fi

          echo ""

      # ==========================================
      # 9. Kernel compatibility
      # ==========================================

      - name: Check kernel compatibility
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          VERSION=$(make -s kernelversion)

          echo "Kernel version: $VERSION"

          case "$VERSION" in
            6.6.*)
              echo "OK: Linux 6.6 kernel family"
              ;;
            *)
              echo "FATAL: unexpected kernel version"
              exit 1
              ;;
          esac

          echo "=== LSM structure ==="

          grep -R -n 'struct lsm_blob_sizes' \
            include/linux security/selinux || true

          echo "=== Kernel commit ==="

          git log -1 --format='%H%n%ci%n%s'

          echo "=== Kernel config ==="

          grep -E \
            '^CONFIG_(KSU|KPM|KSU_SUSFS|KSU_SUSFS_INLINE_HOOK|KALLSYMS_ALL)=' \
            .config

          echo "=== Container config snapshot ==="

          grep -E \
            '^CONFIG_(NAMESPACES|USER_NS|PID_NS|IPC_NS|NET_NS|DEVTMPFS|DEVTMPFS_MOUNT|CGROUPS|CGROUP_PIDS|CFS_BANDWIDTH|SECCOMP|SECCOMP_FILTER|OVERLAY_FS|VETH|BRIDGE|NF_NAT|IP6_NF_NAT)=' \
            .config || true

      # ==========================================
      # 10. Install headers
      # ==========================================

      - name: Install headers
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          make headers_install

          test -f usr/include/linux/unistd.h

          echo "UAPI headers installed"

      # ==========================================
      # 11. Build kernel Image
      # ==========================================

      - name: Build kernel Image
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -uo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          JOBS=$(nproc)

          echo "================================"
          echo "BUILD KERNEL"
          echo "================================"

          echo "CPU jobs: $JOBS"
          echo "KPM requested: ${{ inputs.enable_kpm }}"

          if make -j"$JOBS" Image; then

            echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"

            if grep -qx 'CONFIG_KPM=y' .config; then
              echo "KPM_STATUS=ENABLED" >> "$GITHUB_ENV"
            else
              echo "KPM_STATUS=DISABLED_BY_REQUEST" >> "$GITHUB_ENV"
            fi

          else

            echo "Initial kernel build failed"

            if [ "${{ inputs.enable_kpm }}" != "true" ]; then
              echo "FATAL: build failed without KPM"
              exit 1
            fi

            echo "================================"
            echo "RETRY WITHOUT KPM"
            echo "================================"

            sed -i \
              -e '/^CONFIG_KPM=/d' \
              -e '/^# CONFIG_KPM is not set$/d' \
              .config

            echo "# CONFIG_KPM is not set" >> .config

            make olddefconfig

            if grep -qx 'CONFIG_KPM=y' .config; then
              echo "FATAL: KPM could not be disabled"
              exit 1
            fi

            echo "=== Clean partial objects ==="

            make clean

            echo "=== Rebuild without KPM ==="

            if ! make -j"$JOBS" Image; then
              echo "FATAL: kernel build failed without KPM"
              exit 1
            fi

            echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
            echo "KPM_STATUS=DISABLED_FALLBACK" >> "$GITHUB_ENV"

          fi

          test -s arch/arm64/boot/Image

          echo "=== Image size ==="

          ls -lh arch/arm64/boot/Image

      # ==========================================
      # 12. Verify kernel features
      # ==========================================

      - name: Verify kernel features
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          IMG=arch/arm64/boot/Image

          test -s "$IMG"
          test -s vmlinux

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          echo "================================"
          echo "KERNEL VERIFICATION"
          echo "================================"

          echo "=== Kernel release ==="

          make -s kernelrelease

          WARN_COUNT=0

          echo "=== Required base configurations ==="

          for c in \
            64BIT \
            SECURITY \
            SECURITY_SELINUX \
            EXT4_FS \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL \
            KSU \
            KSU_LSM_SECURITY_HOOKS \
            KSU_SUSFS \
            KSU_SUSFS_INLINE_HOOK \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_SPOOF_UNAME \
            KSU_SUSFS_ENABLE_LOG \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT \
            KSU_SUSFS_SUS_MAP \
            KSU_SUSFS_PRIORITY_UID_FILTER; do

            if grep -qx "CONFIG_${c}=y" .config; then
              echo "OK: $c"
            else
              echo "WARN: CONFIG_${c} missing (build continues)"
              WARN_COUNT=$((WARN_COUNT + 1))
            fi
          done

          echo "=== Hardware access config ==="

          if grep -qx "CONFIG_DEVTMPFS=y" .config; then
            echo "OK: CONFIG_DEVTMPFS=y"
          else
            echo "WARN: CONFIG_DEVTMPFS missing (build continues)"
            WARN_COUNT=$((WARN_COUNT + 1))
          fi

          if grep -qx "CONFIG_DEVTMPFS_MOUNT=y" .config; then
            echo "NOTE: CONFIG_DEVTMPFS_MOUNT=y (inherited from device.config)"
          else
            echo "OK: CONFIG_DEVTMPFS_MOUNT unset"
          fi

          echo "=== Other container items (not managed by this build) ==="

          for c in NAMESPACES USER_NS OVERLAY_FS CGROUPS CGROUP_PIDS CFS_BANDWIDTH IPV6 IP6_NF_NAT VETH BRIDGE; do
            if grep -qx "CONFIG_${c}=y" .config; then
              echo "INFO: CONFIG_${c}=y (inherited)"
            else
              echo "INFO: CONFIG_${c} absent"
            fi
          done

          echo "=== KPM status ==="

          if grep -qx 'CONFIG_KPM=y' .config; then
            echo "KPM ENABLED"
          else
            echo "KPM DISABLED"
          fi

          echo "=== SUSFS object ==="

          test -s fs/susfs.o

          echo "OK: fs/susfs.o"

          echo "=== SukiSU build artifacts ==="

          find drivers/kernelsu -type f \
            \( -name '*.o' -o -name 'built-in.a' \) \
            -size +0c -print

          echo "=== Native AVC implementation ==="

          grep -q \
            'susfs_is_avc_log_spoofing_enabled' \
            security/selinux/avc.c

          grep -q \
            'susfs_set_avc_log_spoofing' \
            fs/susfs.c

          grep -q \
            'susfs_set_batch_sid' \
            KernelSU/kernel/selinux/rules.c

          echo "OK: Native AVC source integration"

          echo "=== Compiled AVC symbols ==="

          llvm-nm -a vmlinux | grep -E \
            'susfs_set_avc_log_spoofing|susfs_is_avc_log_spoofing_enabled|susfs_ksu_sid|susfs_priv_app_sid'

          echo "=== SUSFS symbols ==="

          llvm-nm -a vmlinux | grep -E \
            'susfs_parse_priority_app_strings|susfs_set_priority_uid_filter|susfs_add_sus_path' \
            || true

          echo "=== Kernel image ==="

          file "$IMG"

          ls -lh "$IMG"

          sha256sum "$IMG"

          echo "=== Verification completed ==="

      # ==========================================
      # 13. Generate build information
      # ==========================================

      - name: Generate build information
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          {
            echo "Device: hummer / PKR110"
            echo "ROM: crDroid 13.1"
            echo "Container batch: 1 of 3 (basics only)"
            echo "Android: 17"

            echo "Kernel branch: $KERNEL_BRANCH"
            echo "Kernel commit: $(git -C ws/common rev-parse HEAD)"
            echo "Kernel release: $(make -s -C ws/common kernelrelease)"

            echo "SukiSU branch: $SUKISU_BRANCH"
            echo "SukiSU commit: $(git -C ws/common/KernelSU rev-parse HEAD)"

            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "SUSFS commit: $(git -C ws/susfs rev-parse HEAD)"

            grep -m1 'SUSFS_VERSION' \
              ws/common/include/linux/susfs.h

            echo "Modules commit: $(git -C ws/sm8750-modules rev-parse HEAD)"
            echo "Devicetree commit: $(git -C ws/sm8750-devicetrees rev-parse HEAD)"

            echo "LLVM: $LLVM_VERSION"
            echo "KPM status: $KPM_STATUS"
            echo "Build: $KERNEL_BUILD"

            echo "Date UTC: $(date -u)"
            echo ""

            echo "=== Container runtime configuration ==="

            grep -E \
              '^CONFIG_(NAMESPACES|UTS_NS|IPC_NS|PID_NS|NET_NS|USER_NS|SYSVIPC|POSIX_MQUEUE|DEVTMPFS|DEVTMPFS_MOUNT|CGROUPS|CGROUP_SCHED|CGROUP_PIDS|CGROUP_FREEZER|CGROUP_DEVICE|MEMCG|CPUSETS|CFS_BANDWIDTH|FAIR_GROUP_SCHED|SECCOMP|SECCOMP_FILTER|OVERLAY_FS|TMPFS|SHMEM|VETH|BRIDGE|NF_CONNTRACK|NF_NAT|NETFILTER_XTABLES|IP_NF_NAT|IP_NF_TARGET_MASQUERADE|IPV6|IP6_NF_NAT|IP6_NF_TARGET_MASQUERADE)=' \
              ws/common/.config || true

            echo ""

            echo "=== Kernel configuration ==="

            grep -E \
              '^CONFIG_(KSU|KPM|KSU_SUSFS|KSU_SUSFS_INLINE_HOOK|KSU_SUSFS_.*|KALLSYMS_ALL)=' \
              ws/common/.config || true

            echo ""

            echo "=== Image SHA256 ==="

            sha256sum ws/common/arch/arm64/boot/Image

          } > BUILD-INFO.txt

          cat BUILD-INFO.txt

      # ==========================================
      # 14. Package AnyKernel3
      # ==========================================

      - name: Package AnyKernel3
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            ak3

          cp ws/common/arch/arm64/boot/Image ak3/Image

          cd ak3

          echo "=== Device identification ==="

          sed -i \
            's/^device.name1=.*/device.name1=hummer/' \
            anykernel.sh

          sed -i \
            's/^device.name2=.*/device.name2=PKR110/' \
            anykernel.sh

          sed -i \
            's/^device.name3=.*/device.name3=/' \
            anykernel.sh

          sed -i \
            's/^device.name4=.*/device.name4=/' \
            anykernel.sh

          sed -i \
            's/^device.name5=.*/device.name5=/' \
            anykernel.sh

          echo "=== Boot partition ==="

          sed -i \
            's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' \
            anykernel.sh

          echo "=== A/B device ==="

          sed -i \
            's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' \
            anykernel.sh

          echo "=== Drop cgroup_disable from cmdline if present ==="

          if grep -q 'cgroup_disable' anykernel.sh; then
            sed -i -E 's/cgroup_disable=[a-z,]+[ ]?//g' anykernel.sh
            grep -n 'cgroup_disable' anykernel.sh || true
          fi

          echo "=== Remove repository metadata ==="

          rm -rf .git

          zip -r9 \
            "${{ github.workspace }}/AK3-hummer-builtin-new-susfs.zip" \
            .

          cd "${{ github.workspace }}"

          ls -lh AK3-hummer-builtin-new-susfs.zip

      # ==========================================
      # 15. Upload artifacts
      # ==========================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AK3-hummer-crDroid13.1-builtin-new-susfs
          path: |
            AK3-hummer-builtin-new-susfs.zip
            BUILD-INFO.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
