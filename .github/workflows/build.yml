name: build-hummer-sukisu-builtin-susfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo (device.config)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          test -f device.config || { echo "FATAL: device.config missing"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves zip git curl xz-utils build-essential

      - name: Fetch LLVM 22 toolchain
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-X64.tar.xz"
          mkdir -p "$HOME/llvm"
          tar -xJf /tmp/llvm.tar.xz --no-same-owner -C "$HOME/llvm" --strip-components=1
          "$HOME/llvm/bin/clang" --version | head -2

      - name: Fetch kernel sources
        run: |
          set -euxo pipefail
          mkdir -p ws
          git clone https://github.com/crdroidandroid/android_kernel_oneplus_sm8750 -b 17.0 ws/common
          rm -rf ws/common/.git
          git clone https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-modules -b 17.0 ws/sm8750-modules
          git clone https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-devicetrees -b 17.0 ws/sm8750-devicetrees
          head -4 ws/common/Makefile

      - name: Integrate SuSFS kernel patch
        run: |
          set -euxo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 ws/susfs
          echo "=== SUSFS 版本 ==="
          grep -m1 SUSFS_VERSION ws/susfs/kernel_patches/include/linux/susfs.h

          cd ws/common
          cp ../susfs/kernel_patches/fs/susfs.c fs/
          cp ../susfs/kernel_patches/include/linux/susfs.h \
             ../susfs/kernel_patches/include/linux/susfs_def.h include/linux/
          ls -l include/linux/susfs.h fs/susfs.c

          echo "=== 应用 patch ==="
          patch -p1 --forward < ../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch

          if find . -name "*.rej" | head -1 | grep -q .; then
            echo "=== 被拒绝的 hunk ==="
            find . -name "*.rej" -exec sh -c 'echo "--- {}"; head -30 {}' \;
            exit 1
          fi
          echo "=== SuSFS 内核 patch 完成 ==="

      - name: Integrate SukiSU builtin branch
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s 1cfa57340590971cba7521ed536da8ebbedc5f0a
          cd KernelSU
          echo "=== HEAD ==="
          git rev-parse HEAD
          echo "=== Kconfig 项 ==="
          grep -E "^config (KSU|KPM|KSU_SUSFS)" kernel/Kconfig | head -20

      # ========== 关键修复：补齐缺失的 Kconfig 项 ==========
      - name: Patch SukiSU Kconfig for PRIORITY_UID_FILTER
        working-directory: ${{ github.workspace }}/ws/common/KernelSU
        run: |
          set -euxo pipefail
          KCONFIG=kernel/Kconfig

          echo "=== 检查是否已有 PRIORITY_UID_FILTER ==="
          if grep -q "KSU_SUSFS_PRIORITY_UID_FILTER" "$KCONFIG"; then
            echo "已存在，跳过"
            exit 0
          fi

          echo "=== 插入 CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER 定义 ==="
          # 在 KernelSU - SUSFS menu 的 endmenu 之前插入
          # 找到 "menu \"KernelSU - SUSFS\"" 之后第一个 endmenu
          awk '
            /^menu "KernelSU - SUSFS"/ { inmenu=1 }
            inmenu && /^endmenu/ && !done {
              print "config KSU_SUSFS_PRIORITY_UID_FILTER"
              print "    bool \"Enable priority uid filter\""
              print "    depends on KSU_SUSFS"
              print "    default y"
              print "    help"
              print "        Allow adding uid to priority filter list via pkg_observer strings."
              print "        Required by SukiSU builtin branch (susfs_parse_priority_app_strings)."
              print ""
              done=1
            }
            { print }
          ' "$KCONFIG" > "$KCONFIG.new"
          mv "$KCONFIG.new" "$KCONFIG"

          echo "=== 验证插入结果 ==="
          grep -A6 "config KSU_SUSFS_PRIORITY_UID_FILTER" "$KCONFIG"
          echo "=== 确认 endmenu 结构完整 ==="
          grep -c "^menu" "$KCONFIG"
          grep -c "^endmenu" "$KCONFIG"

      - name: Configure
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail
          export PATH="$HOME/llvm/bin:$PATH"
          cp "${{ github.workspace }}/device.config" .config
          printf "CONFIG_KSU=y\nCONFIG_KPM=y\nCONFIG_KSU_SUSFS=y\nCONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y\n" >> .config
          sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config
          sed -i 's/^CONFIG_LOCALVERSION="-4k"/CONFIG_LOCALVERSION="-4k-g48baf0c723f8"/' .config
          make ARCH=arm64 LLVM=1 olddefconfig

          echo "=== 配置验证 ==="
          for c in CONFIG_KSU CONFIG_KPM CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER \
                   CONFIG_KALLSYMS_ALL CONFIG_KPROBES CONFIG_EXT4_FS CONFIG_HEADERS_INSTALL CONFIG_MODULES; do
            if grep -q "^${c}=y" .config; then
              echo "OK   $c"
            else
              echo "FATAL $c 未启用"
              grep -E "^# ${c}" .config || true
              exit 1
            fi
          done
          echo "=== SuSFS 子项数 ==="
          grep -c "^CONFIG_KSU_SUSFS.*=y" .config
          echo "kernelrelease: $(make -s ARCH=arm64 LLVM=1 kernelrelease)"

      - name: Headers install
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail
          export PATH="$HOME/llvm/bin:$PATH"
          make ARCH=arm64 LLVM=1 headers_install
          test -f usr/include/linux/unistd.h && echo "OK: UAPI headers"

      - name: Build kernel Image
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail
          export PATH="$HOME/llvm/bin:$PATH"
          make ARCH=arm64 LLVM=1 -j"$(nproc)" Image
          test -f arch/arm64/boot/Image
          ls -lh arch/arm64/boot/Image

      - name: Verify all features
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail
          IMG=arch/arm64/boot/Image
          echo "=== Linux version ==="
          strings $IMG | grep -m1 "Linux version"
          echo "=== 功能统计 ==="
          SUS_N=$(strings $IMG | grep -ci susfs)
          KPM_N=$(strings $IMG | grep -ci kpm)
          PRE_N=$(strings $IMG | grep -ci preinit)
          echo "suSFS 字符串:   $SUS_N"
          echo "KPM 字符串:     $KPM_N"
          echo "preinit 字符串: $PRE_N"
          echo "=== 关键函数符号 ==="
          for s in susfs_parse_priority_app_strings susfs_set_priority_uid_filter susfs_add_sus_path; do
            strings $IMG | grep -qx "$s" && echo "OK   $s" || echo "MISS $s"
          done
          echo "=== 产物 ==="
          for o in fs/susfs.o drivers/kernelsu/ksu.o drivers/kernelsu/preinit/preinit.o; do
            [ -f "$o" ] && echo "OK   $o" || echo "MISS $o"
          done
          echo "=== 结论 ==="
          [ "$SUS_N" -gt 10 ] && echo "✅ SuSFS 已编入" || { echo "❌ SuSFS 未编入"; exit 1; }
          [ "$KPM_N" -gt 10 ] && echo "✅ KPM 已编入" || echo "⚠️ KPM 字符串偏少"
          [ "$PRE_N" -gt 10 ] && echo "✅ preinit 已编入" || echo "⚠️ preinit 字符串偏少"

      - name: Package AnyKernel3
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp ws/common/arch/arm64/boot/Image ak3/Image
          cd ak3
          sed -i 's/^device.name1=.*/device.name1=hummer/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=PKR110/' anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=/' anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=/' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' anykernel.sh
          rm -rf .git
          zip -r9 "${{ github.workspace }}/AK3-hummer-builtin-susfs.zip" .
          ls -lh "${{ github.workspace }}/AK3-hummer-builtin-susfs.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AK3-hummer-kernel
          path: AK3-hummer-builtin-susfs.zip
          if-no-files-found: warn
