name: build-hummer-sukisu-builtin-susfs

on:
  workflow_dispatch:
    inputs:
      enable_kpm:
        description: "Try to build with KPM (automatically fallback if it fails)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    defaults:
      run:
        shell: bash

    env:
      KERNEL_BRANCH: "17.0"
      SUSFS_BRANCH: "gki-android15-6.6"
      LLVM_VERSION: "22.1.0"

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout device config
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          test -f device.config || {
            echo "FATAL: device.config missing"
            exit 1
          }

          sudo apt-get update

          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            dwarves zip git curl \
            xz-utils build-essential \
            python3 python3-pip \
            cpio rsync kmod \
            pahole libncurses-dev

      # ==========================================
      # 2. LLVM 22
      # ==========================================
      - name: Fetch LLVM toolchain
        run: |
          set -euxo pipefail

          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o /tmp/llvm.tar.xz \
            "$LLVM_URL"

          mkdir -p "$HOME/llvm"

          tar -xJf /tmp/llvm.tar.xz \
            --no-same-owner \
            -C "$HOME/llvm" \
            --strip-components=1

          export PATH="$HOME/llvm/bin:$PATH"

          clang --version
          ld.lld --version

      # ==========================================
      # 3. Kernel sources
      # ==========================================
      - name: Fetch kernel sources
        run: |
          set -euxo pipefail

          mkdir -p ws

          git clone \
            --branch "$KERNEL_BRANCH" \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750 \
            ws/common

          git clone \
            --branch "$KERNEL_BRANCH" \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-modules \
            ws/sm8750-modules

          git clone \
            --branch "$KERNEL_BRANCH" \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-devicetrees \
            ws/sm8750-devicetrees

          echo "================================"
          echo "KERNEL SOURCE INFORMATION"
          echo "================================"

          for repo in common sm8750-modules sm8750-devicetrees; do
            echo "=== $repo ==="
            git -C "ws/$repo" rev-parse HEAD
            git -C "ws/$repo" log -1 --format="%ci %s"
          done

          echo "=== Kernel version ==="

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
            ws/common/Makefile

          echo "=== Kernel source branch ==="

          git -C ws/common branch --show-current

      # ==========================================
      # 4. SUSFS integration
      # ==========================================
      - name: Integrate SUSFS
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            ws/susfs

          echo "=== SUSFS version ==="

          grep -m1 SUSFS_VERSION \
            ws/susfs/kernel_patches/include/linux/susfs.h

          cd ws/common

          # Copy SUSFS implementation
          cp ../susfs/kernel_patches/fs/susfs.c fs/

          cp ../susfs/kernel_patches/include/linux/susfs.h \
             ../susfs/kernel_patches/include/linux/susfs_def.h \
             include/linux/

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          echo "=== Applying SUSFS patch ==="

          patch --batch -p1 --forward \
            < ../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch

          if find . -name "*.rej" -print -quit | grep -q .; then
            echo "FATAL: SUSFS patch rejected"

            find . -name "*.rej" -exec sh -c \
              'echo "--- $1"; cat "$1"' _ {} \;

            exit 1
          fi

          echo "SUSFS integration completed"

            # ==========================================
      # 5. SukiSU builtin
      # ==========================================
      - name: Integrate SukiSU builtin
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          curl -fLSs \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            -o /tmp/sukisu-setup.sh

          bash /tmp/sukisu-setup.sh builtin

          test -d KernelSU
          test -f drivers/kernelsu/Kconfig

          echo "=== SukiSU HEAD ==="
          git -C KernelSU rev-parse HEAD

          echo "=== SukiSU Kconfig ==="
          grep -E '^config (KSU|KPM|KSU_SUSFS)' \
            KernelSU/kernel/Kconfig | head -40 || true
            

      - name: Inspect SukiSU Safe Mode
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Safe mode implementation ==="

          grep -R -n -E \
            'ksu_is_safe_mode|ksu_handle_input_handle_event|volumedown_pressed_count|ksu_stop_input_hook_runtime|ksu_boot_completed|ksu_module_mounted' \
            KernelSU/kernel

          echo "=== Relevant source files ==="

          find KernelSU/kernel/runtime -maxdepth 2 -type f

          echo "=== ksud.c: input event and safe mode ==="
          sed -n '520,630p' KernelSU/kernel/runtime/ksud.c

          echo "=== ksud.c: boot lifecycle ==="
          sed -n '1,115p' KernelSU/kernel/runtime/ksud.c

          echo "=== ksud.h ==="
          cat KernelSU/kernel/runtime/ksud.h

      
      # ==========================================
      # 5.1 Fix SukiSU SELinux compilation
      # ==========================================
      - name: Fix SukiSU SELinux rules
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          FILE="KernelSU/kernel/selinux/rules.c"
          test -f "$FILE"

          echo "=== Before patch ==="
          grep -nE 'seqno0|policydb->latest_granting' "$FILE" || true

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU/kernel/selinux/rules.c")
          s = p.read_text()

          fixes = {
              "selinux_status_update_policyload(seqno0);":
              "selinux_status_update_policyload(seqno);",

              "policydb->latest_granting = old_pol->latest_granting + 1;":
              "pol->latest_granting = old_pol->latest_granting + 1;",
          }

          for old, new in fixes.items():
              count = s.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FATAL: expected exactly one occurrence, "
                      f"found {count}: {old}"
                  )

              s = s.replace(old, new, 1)
              print(f"FIXED: {old} -> {new}")

          p.write_text(s)
          PY

          echo "=== Verify patch ==="

          if grep -nE 'seqno0|policydb->latest_granting' "$FILE"; then
            echo "FATAL: old code still exists"
            exit 1
          fi

          grep -n 'selinux_status_update_policyload(seqno)' "$FILE"
          grep -n 'pol->latest_granting = old_pol->latest_granting + 1' "$FILE"

          echo "SukiSU SELinux fixes applied successfully"

                # ==========================================

      # 5.2 Fix SukiSU Safe Mode false positive
      # ==========================================
      - name: Fix SukiSU Safe Mode
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU/kernel/runtime/ksud.c")
          s = p.read_text()

          # 1. Add a permanent decision state.
          old = "static bool safe_mode_flag = false;"
          new = """static bool safe_mode_flag = false;
          static bool safe_mode_decided = false;"""

          if s.count(old) != 1:
              raise SystemExit("FATAL: safe_mode_flag anchor mismatch")

          s = s.replace(old, new, 1)

          # 2. Replace safe mode decision logic.
          start = s.index("bool ksu_is_safe_mode(void)")
          end = s.index(
              "static void vol_detector_event",
              start
          )

          old_func = s[start:end]

          new_func = """bool ksu_is_safe_mode(void)
          {
              if (READ_ONCE(safe_mode_decided))
                  return READ_ONCE(safe_mode_flag);

              /*
               * Freeze the decision before unregistering the input hook.
               * Later calls must never change the result.
               */
              WRITE_ONCE(safe_mode_decided, true);

              stop_input_hook();

              if (!READ_ONCE(safe_mode_flag))
                  return false;

              pr_info("volume keys pressed max times, safe mode detected!\\n");
              return true;
          }

          """

          if "already_checked" not in old_func:
              raise SystemExit("FATAL: unexpected safe mode implementation")

          s = s[:start] + new_func + s[end:]

          # 3. Ignore volume events after the decision or boot lifecycle.
          old_event = """    static int vol_down_cnt = 0;

              if (!value)"""

          new_event = """    static int vol_down_cnt = 0;

              if (READ_ONCE(safe_mode_decided) ||
                  READ_ONCE(ksu_module_mounted) ||
                  READ_ONCE(ksu_boot_completed))
                  return;

              if (!value)"""

          if s.count(old_event) != 1:
              raise SystemExit("FATAL: volume event anchor mismatch")

          s = s.replace(old_event, new_event, 1)

          p.write_text(s)

          print("Safe mode patch applied successfully")
          PY

          echo "=== Verify safe mode patch ==="

          grep -n -A22 'bool ksu_is_safe_mode' \
            KernelSU/kernel/runtime/ksud.c

          grep -n -A15 'static void vol_detector_event' \
            KernelSU/kernel/runtime/ksud.c

          grep -n 'safe_mode_decided' \
            KernelSU/kernel/runtime/ksud.c

      # ==========================================
      # 6. PRIORITY UID FILTER
      # ==========================================
      - name: Patch SukiSU PRIORITY_UID_FILTER
        working-directory: ${{ github.workspace }}/ws/common/KernelSU
        run: |
          set -euxo pipefail

          KCONFIG=kernel/Kconfig

          if grep -q '^config KSU_SUSFS_PRIORITY_UID_FILTER$' "$KCONFIG"; then
            echo "PRIORITY_UID_FILTER already exists"
          else
            python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/Kconfig")
          s = p.read_text()

          menu = 'menu "KernelSU - SUSFS"'

          if menu not in s:
              raise SystemExit("FATAL: SUSFS menu not found")

          start = s.index(menu)
          end = s.find("\nendmenu", start)

          if end < 0:
              raise SystemExit("FATAL: SUSFS endmenu not found")

          entry = """
          config KSU_SUSFS_PRIORITY_UID_FILTER
              bool "Enable priority uid filter"
              depends on KSU_SUSFS
              default y
              help
                Allow adding uid to priority filter list via pkg_observer strings.
                Required by SukiSU builtin priority uid filter.
          """

          s = s[:end] + "\n" + entry + s[end:]
          p.write_text(s)
          PY
          fi

          echo "=== Verify PRIORITY_UID_FILTER ==="
          grep -A6 '^config KSU_SUSFS_PRIORITY_UID_FILTER$' "$KCONFIG"

      
      # ==========================================
      # 7. Configure kernel
      # ==========================================
      - name: Configure kernel
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          cp "${{ github.workspace }}/device.config" .config

          echo "=== Remove conflicting definitions ==="

          for c in \
            KSU \
            KPM \
            KSU_SUSFS \
            KSU_SUSFS_PRIORITY_UID_FILTER \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL; do

            sed -i \
              -e "/^CONFIG_${c}=/d" \
              -e "/^# CONFIG_${c} is not set$/d" \
              .config
          done

          echo "=== Enable required dependencies ==="

          cat >> .config <<'EOF'

          # ======================================
          # Architecture and security
          # ======================================

          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_EXT4_FS=y

          # ======================================
          # Kernel debugging and symbols
          # ======================================

          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # ======================================
          # SukiSU Ultra
          # ======================================

          CONFIG_KSU=y
          CONFIG_KPM=y

          # ======================================
          # SUSFS
          # ======================================

          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y

          EOF

          # Avoid automatic git suffix changes
          sed -i \
            's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' \
            .config

          echo "=== Resolve Kconfig dependencies ==="

          make olddefconfig

          echo "=== Final configuration ==="

          for c in \
            64BIT \
            SECURITY \
            SECURITY_SELINUX \
            EXT4_FS \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL \
            KSU \
            KPM \
            KSU_SUSFS \
            KSU_SUSFS_PRIORITY_UID_FILTER; do

            if ! grep -qx "CONFIG_${c}=y" .config; then
              echo "FATAL: CONFIG_${c} is not enabled"

              grep -E \
                "^CONFIG_${c}=|^# CONFIG_${c} is not set" \
                .config || true

              exit 1
            fi

            echo "OK: CONFIG_${c}=y"
          done

          echo "=== Verify KPM dependencies ==="

          grep -E \
            '^CONFIG_(KSU|KPM|64BIT|KALLSYMS|KALLSYMS_ALL|DEBUG_KERNEL)=y$' \
            .config

          echo "=== Verify SUSFS configuration ==="

          grep -E \
            '^CONFIG_KSU_SUSFS.*=y$' \
            .config || true

          echo "=== Verify KPROBES status ==="

          grep -E \
            '^CONFIG_KPROBES=|^# CONFIG_KPROBES is not set' \
            .config || true

          echo "=== Kernel release ==="

          make -s kernelrelease

      # ==========================================
      # 8. Kernel source compatibility
      # ==========================================
      - name: Check kernel compatibility
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          VERSION=$(make -s kernelversion)

          echo "Kernel version: $VERSION"

          case "$VERSION" in
            6.6.*)
              echo "OK: Linux 6.6 kernel family"
              ;;
            *)
              echo "FATAL: unexpected kernel version"
              exit 1
              ;;
          esac

          echo "=== LSM structure ==="

          grep -R -n 'struct lsm_blob_sizes' \
            include/linux security/selinux || true

          echo "=== Kernel source commit ==="

          git log -1 --format='%H%n%ci%n%s'

          echo "=== Kernel configuration ==="

          grep -E \
            'CONFIG_(KSU|KPM|KSU_SUSFS|KALLSYMS_ALL)=' \
            .config

      # ==========================================
      # 9. Headers
      # ==========================================
      - name: Install headers
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          make headers_install

          test -f usr/include/linux/unistd.h

          echo "UAPI headers installed"

      # ==========================================
      # 10. Build Image
      # ==========================================
      - name: Build kernel Image
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -uo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          JOBS=$(nproc)

          echo "================================"
          echo "BUILD KERNEL"
          echo "================================"

          echo "CPU jobs: $JOBS"
          echo "KPM requested: ${{ inputs.enable_kpm }}"

          if make -j"$JOBS" Image; then
            echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
            echo "KPM_STATUS=ENABLED" >> "$GITHUB_ENV"

          else
            echo "Initial build failed"

            if [ "${{ inputs.enable_kpm }}" != "true" ]; then
              echo "KPM fallback not requested"
              exit 1
            fi

            echo "================================"
            echo "RETRY WITHOUT KPM"
            echo "================================"

            sed -i \
              -e '/^CONFIG_KPM=/d' \
              -e '/^# CONFIG_KPM is not set/d' \
              .config

            echo "# CONFIG_KPM is not set" >> .config

            make olddefconfig

            if grep -qx 'CONFIG_KPM=y' .config; then
              echo "FATAL: KPM could not be disabled"
              exit 1
            fi

            # Clean partial objects but preserve configuration
            make clean

            if ! make -j"$JOBS" Image; then
              echo "FATAL: kernel build failed without KPM"
              exit 1
            fi

            echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
            echo "KPM_STATUS=DISABLED_FALLBACK" >> "$GITHUB_ENV"
          fi

          test -s arch/arm64/boot/Image

          echo "=== Image size ==="
          ls -lh arch/arm64/boot/Image

      
      # ==========================================
      # 11. Verify kernel features
      # ==========================================
      - name: Verify kernel features
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          IMG=arch/arm64/boot/Image

          test -s "$IMG"
          test -s vmlinux

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          echo "================================"
          echo "KERNEL VERIFICATION"
          echo "================================"

          echo "=== Kernel release ==="
          make -s kernelrelease

          echo "=== Required configurations ==="

          for c in \
            64BIT \
            SECURITY \
            SECURITY_SELINUX \
            EXT4_FS \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL \
            KSU \
            KSU_SUSFS \
            KSU_SUSFS_PRIORITY_UID_FILTER; do

            grep -qx "CONFIG_${c}=y" .config || {
              echo "FATAL: CONFIG_${c} missing"
              exit 1
            }

            echo "OK: $c"
          done

          echo "=== KPM status ==="

          if grep -qx 'CONFIG_KPM=y' .config; then
            echo "KPM ENABLED"
          else
            echo "KPM DISABLED (fallback)"
          fi

          echo "=== SUSFS objects ==="

          test -s fs/susfs.o
          echo "OK: fs/susfs.o"

          echo "=== KernelSU objects ==="

          test -d drivers/kernelsu

          find drivers/kernelsu \
            -name '*.o' \
            -type f | head -30

          echo "=== SUSFS symbols ==="

          nm -a vmlinux | grep -E \
            'susfs_parse_priority_app_strings|susfs_set_priority_uid_filter|susfs_add_sus_path' \
            || true

          echo "=== Kernel image ==="

          file "$IMG"
          ls -lh "$IMG"
          sha256sum "$IMG"

          echo "=== Kernel config summary ==="

          grep -E \
            '^CONFIG_(64BIT|SECURITY|SECURITY_SELINUX|EXT4_FS|DEBUG_KERNEL|KALLSYMS|KALLSYMS_ALL|KSU|KPM|KSU_SUSFS.*)=y$' \
            .config

          echo "=== Verification completed ==="

      # ==========================================
      # 12. Build information
      # ==========================================
      - name: Generate build information
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          cd "${{ github.workspace }}"

          {
            echo "Device: hummer / PKR110"
            echo "ROM: crDroid 13.1"
            echo "Android: 17"
            echo "Kernel branch: $KERNEL_BRANCH"
            echo "Kernel release: $(make -s -C ws/common kernelrelease)"
            echo "Kernel commit: $(git -C ws/common rev-parse HEAD)"
            echo "Modules commit: $(git -C ws/sm8750-modules rev-parse HEAD)"
            echo "Devicetree commit: $(git -C ws/sm8750-devicetrees rev-parse HEAD)"
            echo "SukiSU commit: $(git -C ws/common/KernelSU rev-parse HEAD)"
            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "LLVM: $LLVM_VERSION"
            echo "KPM status: $KPM_STATUS"
            echo "Build: $KERNEL_BUILD"
            echo "Date UTC: $(date -u)"
            echo ""
            echo "=== Kernel config ==="
            grep -E '^CONFIG_(KSU|KPM|KSU_SUSFS|KALLSYMS_ALL)=' \
              ws/common/.config || true
            echo ""
            echo "=== Image SHA256 ==="
            sha256sum ws/common/arch/arm64/boot/Image
          } > BUILD-INFO.txt

          cat BUILD-INFO.txt

      # ==========================================
      # 13. Package AnyKernel3
      # ==========================================
      - name: Package AnyKernel3
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            ak3

          cp ws/common/arch/arm64/boot/Image ak3/Image

          cd ak3

          # Device identification
          sed -i \
            's/^device.name1=.*/device.name1=hummer/' \
            anykernel.sh

          sed -i \
            's/^device.name2=.*/device.name2=PKR110/' \
            anykernel.sh

          sed -i \
            's/^device.name3=.*/device.name3=/' \
            anykernel.sh

          sed -i \
            's/^device.name4=.*/device.name4=/' \
            anykernel.sh

          sed -i \
            's/^device.name5=.*/device.name5=/' \
            anykernel.sh

          # Boot partition
          sed -i \
            's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' \
            anykernel.sh

          # A/B device
          sed -i \
            's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' \
            anykernel.sh

          # Remove repository metadata
          rm -rf .git

          zip -r9 \
            "${{ github.workspace }}/AK3-hummer-builtin-susfs.zip" \
            .

          cd "${{ github.workspace }}"

          ls -lh AK3-hummer-builtin-susfs.zip

      # ==========================================
      # 14. Upload
      # ==========================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AK3-hummer-crDroid13.1-builtin-susfs
          path: |
            AK3-hummer-builtin-susfs.zip
            BUILD-INFO.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
