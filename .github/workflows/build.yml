
name: build-hummer-sukisu-builtin-new-susfs

on:
  workflow_dispatch:
    inputs:
      enable_kpm:
        description: "Enable KPM; automatically retry without KPM if compilation fails"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hummer-sukisu-builtin-new-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    defaults:
      run:
        shell: bash

    env:
      KERNEL_BRANCH: "17.0"
      SUSFS_BRANCH: "gki-android15-6.6"
      SUKISU_BRANCH: "builtin-new"
      SUKISU_REPO: "https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
      LLVM_VERSION: "22.1.0"
      KPM_REPO: "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch.git"
      KPM_BRANCH: "main"

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout device configuration
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          test -f device.config

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            pahole \
            zip \
            git \
            curl \
            wget \
            xz-utils \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            cpio \
            rsync \
            kmod \
            libncurses-dev \
            lz4 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            zlib1g-dev \
            cmake \
            ninja-build \
            pkg-config \
            libz-dev \
            liblz4-dev \
            libzstd-dev \
            libssl-dev \
            clang \
            llvm \
            file \
            xxd

      # ==========================================
      # 2. LLVM 22
      # ==========================================

      - name: Fetch LLVM toolchain
        run: |
          set -euxo pipefail

          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o /tmp/llvm.tar.xz \
            "$LLVM_URL"

          mkdir -p "$HOME/llvm"

          tar -xJf /tmp/llvm.tar.xz \
            --no-same-owner \
            -C "$HOME/llvm" \
            --strip-components=1

          export PATH="$HOME/llvm/bin:$PATH"

          clang --version
          ld.lld --version
          llvm-nm --version

      # ==========================================
      # 3. Kernel sources
      # ==========================================

      - name: Fetch kernel sources
        run: |
          set -euxo pipefail

          mkdir -p ws

          git clone \
            --branch "$KERNEL_BRANCH" \
            --single-branch \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750 \
            ws/common

          git clone \
            --branch "$KERNEL_BRANCH" \
            --single-branch \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-modules \
            ws/sm8750-modules

          git clone \
            --branch "$KERNEL_BRANCH" \
            --single-branch \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-devicetrees \
            ws/sm8750-devicetrees

          echo "================================"
          echo "KERNEL SOURCE INFORMATION"
          echo "================================"

          for repo in common sm8750-modules sm8750-devicetrees; do
            echo "=== $repo ==="
            git -C "ws/$repo" rev-parse HEAD
            git -C "ws/$repo" log -1 --format="%ci %s"
          done

          echo "=== Kernel version ==="

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
            ws/common/Makefile

          echo "=== Kernel branch ==="

          git -C ws/common branch --show-current

          
      # ==========================================
      # 3.5. KernelPatch sources
      # ==========================================

      - name: Fetch KernelPatch sources
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KPM_BRANCH" \
            "$KPM_REPO" \
            ws/kernelpatch

          echo "=== KernelPatch commit ==="

          git -C ws/kernelpatch rev-parse HEAD

          echo "=== Verify KPM ABI v2 ==="

          grep -q \
            'SUKISU_KPM_ABI_VERSION 2' \
            ws/kernelpatch/kernel/patch/sukisu/supercall.h

          grep -q \
            'SUKISU_KPM_SUPERCALL_MAGIC2' \
            ws/kernelpatch/kernel/patch/sukisu/supercall.h

          test -s ws/kernelpatch/kernel/Makefile
          test -s ws/kernelpatch/tools/Makefile
          test -s ws/kernelpatch/patch/main.cpp

          echo "KernelPatch sources verified"


      # ==========================================
      # 4. SUSFS integration
      # ==========================================

      - name: Integrate SUSFS
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Fetch SUSFS ==="

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            ../susfs

          echo "=== SUSFS version ==="

          grep -m1 'SUSFS_VERSION' \
            ../susfs/kernel_patches/include/linux/susfs.h

          echo "=== SUSFS commit ==="

          git -C ../susfs rev-parse HEAD

          # Copy SUSFS implementation

          cp ../susfs/kernel_patches/fs/susfs.c fs/

          cp \
            ../susfs/kernel_patches/include/linux/susfs.h \
            ../susfs/kernel_patches/include/linux/susfs_def.h \
            include/linux/

          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

          echo "=== Apply SUSFS kernel patch ==="

          patch --batch -p1 --forward \
            < ../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch

          if find . -name "*.rej" -print -quit | grep -q .; then
            echo "FATAL: SUSFS patch rejected"

            find . -name "*.rej" -exec sh -c \
              'echo "--- $1"; cat "$1"' _ {} \;

            exit 1
          fi

          echo "=== Verify SUSFS integration ==="

          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

          grep -q 'susfs_is_avc_log_spoofing_enabled' \
            security/selinux/avc.c

          grep -q 'susfs_ksu_sid' \
            security/selinux/avc.c

          grep -q 'susfs_priv_app_sid' \
            security/selinux/avc.c

          grep -q 'susfs_set_avc_log_spoofing' \
            fs/susfs.c

          echo "SUSFS integration passed"

      # ==========================================
      # 5. SukiSU builtin-new
      # ==========================================

      - name: Integrate SukiSU builtin-new
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Verify remote branch ==="

          git ls-remote --exit-code --heads \
            "$SUKISU_REPO" \
            "refs/heads/$SUKISU_BRANCH"

          echo "=== Clone exact branch ==="

          test ! -e KernelSU

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$SUKISU_BRANCH" \
            "$SUKISU_REPO" \
            KernelSU

          ACTUAL_BRANCH=$(git -C KernelSU branch --show-current)
          ACTUAL_COMMIT=$(git -C KernelSU rev-parse HEAD)

          echo "Branch: $ACTUAL_BRANCH"
          echo "Commit: $ACTUAL_COMMIT"

          test "$ACTUAL_BRANCH" = "$SUKISU_BRANCH"

          echo "=== Verify branch Kconfig ==="

          grep -q '^config KSU_SUSFS$' \
            KernelSU/kernel/Kconfig

          grep -q '^config KSU_SUSFS_INLINE_HOOK$' \
            KernelSU/kernel/Kconfig

          grep -q '^config KPM$' \
            KernelSU/kernel/Kconfig

          echo "=== Integrate into drivers ==="

          test -d drivers
          test -f drivers/Makefile
          test -f drivers/Kconfig

          test ! -e drivers/kernelsu
          test ! -L drivers/kernelsu

          ln -s ../KernelSU/kernel drivers/kernelsu

          if ! grep -Fq \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile; then

            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> drivers/Makefile
          fi

          if ! grep -Fq \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/Kconfig")
          data = p.read_text()

          pos = data.rfind("endmenu")

          if pos < 0:
              raise SystemExit("FATAL: drivers/Kconfig endmenu missing")

          entry = 'source "drivers/kernelsu/Kconfig"\n\n'

          data = data[:pos] + entry + data[pos:]
          p.write_text(data)
          PY

          fi

          echo "=== Verify integration ==="

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -f drivers/kernelsu/ksu.c

          readlink -f drivers/kernelsu

          grep -F \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -F \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          echo "SukiSU builtin-new integration passed"

      # ==========================================
      # 6. SELinux compatibility
      # ==========================================

      - name: Verify SukiSU SELinux implementation
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          FILE=KernelSU/kernel/selinux/rules.c

          test -s "$FILE"

          echo "=== Verify policy update implementation ==="

          grep -n \
            'pol->latest_granting = old_pol->latest_granting + 1' \
            "$FILE"

          echo "=== Verify SUSFS SID refresh ==="

          grep -n \
            'susfs_set_batch_sid' \
            "$FILE"

          echo "=== Reject stale compatibility code ==="

          if grep -n 'seqno0' "$FILE"; then
            echo "FATAL: stale seqno0 reference"
            exit 1
          fi

          echo "SELinux implementation verified"

      # ==========================================
      # 7. Native AVC spoofing
      # ==========================================

      - name: Verify Native AVC Spoofing
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Verify AVC implementation ==="

          AVC=security/selinux/avc.c
          SUSFS=fs/susfs.c
          HEADER=include/linux/susfs.h
          RULES=KernelSU/kernel/selinux/rules.c

          test -s "$AVC"
          test -s "$SUSFS"
          test -s "$HEADER"
          test -s "$RULES"

          grep -n \
            'susfs_is_avc_log_spoofing_enabled' \
            "$AVC"

          grep -n 'susfs_ksu_sid' "$AVC"
          grep -n 'susfs_priv_app_sid' "$AVC"

          echo "=== Verify static key ==="

          grep -n \
            'DEFINE_STATIC_KEY_FALSE(susfs_is_avc_log_spoofing_enabled)' \
            "$SUSFS"

          echo "=== Verify AVC control interface ==="

          grep -n 'susfs_set_avc_log_spoofing' \
            "$SUSFS"

          grep -n 'susfs_set_avc_log_spoofing' \
            "$HEADER"

          echo "=== Verify SELinux SID refresh ==="

          grep -n 'susfs_set_batch_sid' "$RULES"

          echo "=== Verify manager command integration ==="

          grep -R -n \
            'susfs_set_avc_log_spoofing' \
            KernelSU/kernel

          echo "Native AVC Spoofing implementation verified"

      # ==========================================
      # 8. Configure kernel
      # ==========================================

      - name: Configure kernel
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          cp "${{ github.workspace }}/device.config" .config

          echo "=== Remove old SukiSU definitions ==="

          sed -i -E \
            '/^(CONFIG_(KSU|KPM)(_[A-Z0-9_]+)?=|# CONFIG_(KSU|KPM)(_[A-Z0-9_]+)? is not set)/d' \
            .config

          echo "=== Configure architecture and security ==="

          cat >> .config <<'EOF'

          # Architecture
          CONFIG_64BIT=y
          CONFIG_ARM64=y

          # Security
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_EXT4_FS=y

          # Debugging and symbols
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # SukiSU Ultra
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_FEATURE_SULOG=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_ENABLE_FULL_UID_CHECKS=y

          # KPM
          EOF

          if [ "${{ inputs.enable_kpm }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> .config
          else
            echo "# CONFIG_KPM is not set" >> .config
          fi

          cat >> .config <<'EOF'

          # SUSFS core
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_INLINE_HOOK=y

          # SUSFS features
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y

          EOF

          echo "=== Disable automatic git suffix ==="

          sed -i \
            's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' \
            .config

          echo "=== Resolve Kconfig dependencies ==="

          make olddefconfig

          echo "=== Verify required configuration ==="

          for c in \
            64BIT \
            SECURITY \
            SECURITY_SELINUX \
            EXT4_FS \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL \
            KSU \
            KSU_LSM_SECURITY_HOOKS \
            KSU_FEATURE_SULOG \
            KSU_FEATURE_ADBROOT \
            KSU_ENABLE_FULL_UID_CHECKS \
            KSU_SUSFS \
            KSU_SUSFS_INLINE_HOOK \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_SPOOF_UNAME \
            KSU_SUSFS_ENABLE_LOG \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT \
            KSU_SUSFS_SUS_MAP \
            KSU_SUSFS_PRIORITY_UID_FILTER; do

            if ! grep -qx "CONFIG_${c}=y" .config; then
              echo "FATAL: CONFIG_${c} is not enabled"

              grep -E \
                "^CONFIG_${c}=|^# CONFIG_${c} is not set" \
                .config || true

              exit 1
            fi

            echo "OK: CONFIG_${c}=y"
          done

          echo "=== Verify KPM configuration ==="

          if [ "${{ inputs.enable_kpm }}" = "true" ]; then
            grep -qx 'CONFIG_KPM=y' .config
            echo "KPM requested and enabled"
          else
            ! grep -qx 'CONFIG_KPM=y' .config
            echo "KPM disabled by request"
          fi

          echo "=== Verify SukiSU hook backend ==="

          grep -qx 'CONFIG_KSU_SUSFS=y' .config
          grep -qx 'CONFIG_KSU_SUSFS_INLINE_HOOK=y' .config

          if grep -qx 'CONFIG_KSU_KPROBES_KSUD=y' .config; then
            echo "FATAL: KSU Kprobes backend unexpectedly enabled"
            exit 1
          fi

          echo "SUSFS inline hook backend selected"

          echo "=== Global KPROBES status ==="

          grep -E \
            '^CONFIG_KPROBES=|^# CONFIG_KPROBES is not set' \
            .config || true

          echo "=== Kernel release ==="

          make -s kernelrelease

      # ==========================================
      # 9. Kernel compatibility
      # ==========================================

      - name: Check kernel compatibility
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          VERSION=$(make -s kernelversion)

          echo "Kernel version: $VERSION"

          case "$VERSION" in
            6.6.*)
              echo "OK: Linux 6.6 kernel family"
              ;;
            *)
              echo "FATAL: unexpected kernel version"
              exit 1
              ;;
          esac

          echo "=== LSM structure ==="

          grep -R -n 'struct lsm_blob_sizes' \
            include/linux security/selinux || true

          echo "=== Kernel commit ==="

          git log -1 --format='%H%n%ci%n%s'

          echo "=== Kernel config ==="

          grep -E \
            '^CONFIG_(KSU|KPM|KSU_SUSFS|KSU_SUSFS_INLINE_HOOK|KALLSYMS_ALL)=' \
            .config

      # ==========================================
      # 10. Install headers
      # ==========================================

      - name: Install headers
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          make headers_install

          test -f usr/include/linux/unistd.h

          echo "UAPI headers installed"

      
      # ==========================================
      # 11. Build kernel with KPM fallback
      # ==========================================

      - name: Build kernel Image
        id: build_kernel
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -uo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          JOBS=$(nproc)

          echo "================================"
          echo "BUILD KERNEL"
          echo "================================"

          echo "CPU jobs: $JOBS"
          echo "KPM requested: ${{ inputs.enable_kpm }}"

          if [ "${{ inputs.enable_kpm }}" = "true" ]; then

            echo "=== Build with KPM ==="

            if make -j"$JOBS" Image \
              2>&1 | tee "$RUNNER_TEMP/kernel-kpm.log"; then

              grep -qx 'CONFIG_KPM=y' .config || {
                echo "FATAL: KPM config disappeared"
                exit 1
              }

              grep -Fq -- '-- KPM is enabled' \
                "$RUNNER_TEMP/kernel-kpm.log" || {
                echo "FATAL: SukiSU did not enable KPM compilation"
                exit 1
              }

              echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
              echo "KPM_STATUS=ENABLED" >> "$GITHUB_ENV"
              echo "kpm_status=ENABLED" >> "$GITHUB_OUTPUT"

            else

              echo "================================"
              echo "KPM BUILD FAILED"
              echo "RETRY WITHOUT KPM"
              echo "================================"

              echo "=== Remove KPM configuration ==="

              sed -i \
                -e '/^CONFIG_KPM=/d' \
                -e '/^# CONFIG_KPM is not set$/d' \
                .config

              echo "# CONFIG_KPM is not set" >> .config

              make olddefconfig

              if grep -qx 'CONFIG_KPM=y' .config; then
                echo "FATAL: KPM could not be disabled"
                exit 1
              fi

              echo "=== Clean partial objects ==="

              make clean

              echo "=== Rebuild without KPM ==="

              if ! make -j"$JOBS" Image \
                2>&1 | tee "$RUNNER_TEMP/kernel-no-kpm.log"; then

                echo "FATAL: kernel build failed without KPM"
                exit 1
              fi

              echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
              echo "KPM_STATUS=DISABLED_FALLBACK" >> "$GITHUB_ENV"
              echo "kpm_status=ENABLED" >> "$GITHUB_OUTPUT"

            fi

          else

            echo "=== KPM disabled by request ==="

            ! grep -qx 'CONFIG_KPM=y' .config || {
              echo "FATAL: unexpected KPM configuration"
              exit 1
            }

            if ! make -j"$JOBS" Image \
              2>&1 | tee "$RUNNER_TEMP/kernel-no-kpm.log"; then

              echo "FATAL: kernel build failed"
              exit 1
            fi

            echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
            echo "KPM_STATUS=DISABLED_BY_REQUEST" >> "$GITHUB_ENV"
            echo "kpm_status=ENABLED" >> "$GITHUB_OUTPUT"

          fi

          test -s arch/arm64/boot/Image
          test -s vmlinux

          echo "=== Build result ==="

          echo "KPM status: $(grep '^KPM_STATUS=' "$GITHUB_ENV" | tail -1)"

          ls -lh arch/arm64/boot/Image

          
      # ==========================================
      # 11.5. Build KernelPatch KPM engine
      # ==========================================

      
      - name: Build KernelPatch engine
        if: ${{ steps.build_kernel.outputs.kpm_status == 'ENABLED' }}
        run: |
          set -euxo pipefail

          KP="$GITHUB_WORKSPACE/ws/kernelpatch"
          JOBS=$(nproc)

          echo "================================"
          echo "BUILD KPM ENGINE"
          echo "================================"

          echo "=== Fix ARM64 stack protector ==="

          KP_MAKEFILE="$KP/kernel/Makefile"

          python3 - "$KP_MAKEFILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          old = "CFLAGS += -Wall -fno-builtin -std=gnu11 -nostdinc -mgeneral-regs-only -ffixed-x18"
          new = old + " -fno-stack-protector"

          if new in s:
              print("Already fixed")
          elif s.count(old) == 1:
              p.write_text(s.replace(old, new))
              print("Applied -fno-stack-protector")
          else:
              raise SystemExit(
                  "FATAL: ARM64 CFLAGS pattern not found exactly once"
              )
          PY

          grep -n '^CFLAGS +=' "$KP_MAKEFILE"

          echo "=== Clean previous build ==="
          make -C "$KP/kernel" clean

          echo "=== Build ARM64 kpimg ==="

          make -C "$KP/kernel" \
            -j"$JOBS" \
            TARGET_COMPILE=aarch64-linux-gnu-

          test -s "$KP/kernel/kpimg"

          file "$KP/kernel/kpimg"

          echo "=== Build Linux kptools ==="

          make -C "$KP/tools" -j"$JOBS"

          test -s "$KP/tools/kptools"

          file "$KP/tools/kptools"

          echo "=== Prepare patch resources ==="

          mkdir -p "$KP/patch/res"

          cp "$KP/kernel/kpimg" \
            "$KP/patch/res/kpimg"

          cp "$KP/tools/kptools" \
            "$KP/patch/res/kptools-linux"

          # Linux host patcher does not use the Android binary.
          # main.cpp nevertheless includes its generated header.

          printf '\001' \
            > "$KP/patch/res/kptools-android"

          echo "=== Build Linux patcher ==="

          make -C "$KP/patch" clean

          make -C "$KP/patch" -j"$JOBS"

          test -s "$KP/patch/patch"

          echo "=== Verify generated resources ==="

          test -s "$KP/patch/include/kpimg_enc.h"
          test -s "$KP/patch/include/kptools_linux.h"
          test -s "$KP/patch/include/kptools_android.h"

          echo "=== Verify patcher ==="

          file "$KP/patch/patch"

          echo "=== KernelPatch build information ==="

          git -C "$KP" rev-parse HEAD

          echo "KPM engine build completed"

          
      # ==========================================
      # 11.6. Inject KernelPatch into kernel Image
      # ==========================================

      - name: Inject KernelPatch into Image
        if: ${{ steps.build_kernel.outputs.kpm_status == 'ENABLED' }}
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          BOOT=arch/arm64/boot
          PATCH="$GITHUB_WORKSPACE/ws/kernelpatch/patch/patch"

          echo "================================"
          echo "KPM IMAGE INJECTION"
          echo "================================"

          test -s "$BOOT/Image"
          test -s "$PATCH"

          cd "$BOOT"

          echo "=== Preserve original Image ==="

          cp Image Image.unpatched

          rm -f oImage Image.kpm

          echo "=== Execute KernelPatch patcher ==="

          "$PATCH"

          echo "=== Verify patched Image ==="

          if [ ! -s oImage ]; then
            echo "FATAL: KernelPatch failed to generate oImage"
            exit 1
          fi

          mv oImage Image.kpm

          test -s Image.kpm

          echo "=== Compare image sizes ==="

          ls -lh Image.unpatched Image.kpm

          echo "=== SHA256 ==="

          sha256sum Image.unpatched Image.kpm

          echo "=== Image identification ==="

          file Image.kpm

          echo "KPM image injection completed"



      # ==========================================
      # 12. Verify kernel features
      # ==========================================

      - name: Verify kernel features
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          IMG=arch/arm64/boot/Image

          test -s "$IMG"
          test -s vmlinux

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          echo "================================"
          echo "KERNEL VERIFICATION"
          echo "================================"

          echo "=== Kernel release ==="

          make -s kernelrelease

          echo "=== Required configurations ==="

          for c in \
            64BIT \
            SECURITY \
            SECURITY_SELINUX \
            EXT4_FS \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL \
            KSU \
            KSU_LSM_SECURITY_HOOKS \
            KSU_SUSFS \
            KSU_SUSFS_INLINE_HOOK \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_SPOOF_UNAME \
            KSU_SUSFS_ENABLE_LOG \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT \
            KSU_SUSFS_SUS_MAP \
            KSU_SUSFS_PRIORITY_UID_FILTER; do

            grep -qx "CONFIG_${c}=y" .config || {
              echo "FATAL: CONFIG_${c} missing"
              exit 1
            }

            echo "OK: $c"
          done

                    echo "=== KPM verification ==="

          if [ "$KPM_STATUS" = "ENABLED" ]; then
            echo "KPM build status: ENABLED"
            grep -qx 'CONFIG_KPM=y' .config

            test -s arch/arm64/boot/Image.kpm

            echo "KPM injected Image:"
            ls -lh arch/arm64/boot/Image.kpm

            sha256sum arch/arm64/boot/Image.kpm

          else
            echo "KPM build status: $KPM_STATUS"

            if grep -qx 'CONFIG_KPM=y' .config; then
              echo "FATAL: KPM config is enabled but build status is not ENABLED"
              exit 1
            fi
          fi

          echo "=== SUSFS object ==="

          test -s fs/susfs.o

          echo "OK: fs/susfs.o"

          echo "=== SukiSU build artifacts ==="

          find drivers/kernelsu -type f \
            \( -name '*.o' -o -name 'built-in.a' \) \
            -size +0c -print

          echo "=== SukiSU artifact inspection completed ==="
          echo "=== Native AVC implementation ==="

          grep -q \
            'susfs_is_avc_log_spoofing_enabled' \
            security/selinux/avc.c

          grep -q \
            'susfs_set_avc_log_spoofing' \
            fs/susfs.c

          grep -q \
            'susfs_set_batch_sid' \
            KernelSU/kernel/selinux/rules.c

          echo "OK: Native AVC source integration"

          echo "=== Compiled AVC symbols ==="

          llvm-nm -a vmlinux | grep -E \
            'susfs_set_avc_log_spoofing|susfs_is_avc_log_spoofing_enabled|susfs_ksu_sid|susfs_priv_app_sid'

          echo "=== SUSFS symbols ==="

          llvm-nm -a vmlinux | grep -E \
            'susfs_parse_priority_app_strings|susfs_set_priority_uid_filter|susfs_add_sus_path' \
            || true

          echo "=== Kernel image ==="

          file "$IMG"

          ls -lh "$IMG"

          sha256sum "$IMG"

          echo "=== Verification completed ==="

      # ==========================================
      # 13. Generate build information
      # ==========================================

      - name: Generate build information
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          {
            echo "Device: hummer / PKR110"
            echo "ROM: crDroid 13.1"
            echo "Android: 17"

            echo "Kernel branch: $KERNEL_BRANCH"
            echo "Kernel commit: $(git -C ws/common rev-parse HEAD)"
            echo "Kernel release: $(make -s -C ws/common kernelrelease)"

            echo "SukiSU branch: $SUKISU_BRANCH"
            echo "SukiSU commit: $(git -C ws/common/KernelSU rev-parse HEAD)"

            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "SUSFS commit: $(git -C ws/susfs rev-parse HEAD)"

            grep -m1 'SUSFS_VERSION' \
              ws/common/include/linux/susfs.h

            echo "Modules commit: $(git -C ws/sm8750-modules rev-parse HEAD)"
            echo "Devicetree commit: $(git -C ws/sm8750-devicetrees rev-parse HEAD)"

            echo "LLVM: $LLVM_VERSION"
            echo "KPM status: $KPM_STATUS"
            echo "Build: $KERNEL_BUILD"

            echo "Date UTC: $(date -u)"
            echo ""

            echo "=== Kernel configuration ==="

            grep -E \
              '^CONFIG_(KSU|KPM|KSU_SUSFS|KSU_SUSFS_INLINE_HOOK|KSU_SUSFS_.*|KALLSYMS_ALL)=' \
              ws/common/.config || true

            echo ""

            echo "=== Image SHA256 ==="

            sha256sum ws/common/arch/arm64/boot/Image

          } > BUILD-INFO.txt

          cat BUILD-INFO.txt

      # ==========================================
      # 14. Package AnyKernel3
      # ==========================================

      - name: Package AnyKernel3
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            ak3

          cp ws/common/arch/arm64/boot/Image ak3/Image

          cd ak3

          echo "=== Device identification ==="

          sed -i \
            's/^device.name1=.*/device.name1=hummer/' \
            anykernel.sh

          sed -i \
            's/^device.name2=.*/device.name2=PKR110/' \
            anykernel.sh

          sed -i \
            's/^device.name3=.*/device.name3=/' \
            anykernel.sh

          sed -i \
            's/^device.name4=.*/device.name4=/' \
            anykernel.sh

          sed -i \
            's/^device.name5=.*/device.name5=/' \
            anykernel.sh

          echo "=== Boot partition ==="

          sed -i \
            's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' \
            anykernel.sh

          echo "=== A/B device ==="

          sed -i \
            's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' \
            anykernel.sh

          echo "=== Remove repository metadata ==="

          rm -rf .git

          zip -r9 \
            "${{ github.workspace }}/AK3-hummer-builtin-new-susfs.zip" \
            .

          cd "${{ github.workspace }}"

          ls -lh AK3-hummer-builtin-new-susfs.zip

      # ==========================================
      # 15. Upload artifacts
      # ==========================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AK3-hummer-crDroid13.1-builtin-new-susfs
          path: |
            AK3-hummer-builtin-new-susfs.zip
            BUILD-INFO.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
