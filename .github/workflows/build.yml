name: build-hummer-sukisu-builtin-susfs

on:
  workflow_dispatch:
    inputs:
      enable_kpm:
        description: "Try to build with KPM (automatically fallback if it fails)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    defaults:
      run:
        shell: bash

    env:
      KERNEL_BRANCH: "17.0"
      SUSFS_BRANCH: "gki-android15-6.6"
      LLVM_VERSION: "22.1.0"

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout device config
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          test -f device.config || {
            echo "FATAL: device.config missing"
            exit 1
          }

          sudo apt-get update

          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            dwarves zip git curl \
            xz-utils build-essential \
            python3 python3-pip \
            cpio rsync kmod \
            pahole libncurses-dev

      # ==========================================
      # 2. LLVM 22
      # ==========================================
      - name: Fetch LLVM toolchain
        run: |
          set -euxo pipefail

          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o /tmp/llvm.tar.xz \
            "$LLVM_URL"

          mkdir -p "$HOME/llvm"

          tar -xJf /tmp/llvm.tar.xz \
            --no-same-owner \
            -C "$HOME/llvm" \
            --strip-components=1

          export PATH="$HOME/llvm/bin:$PATH"

          clang --version
          ld.lld --version

      # ==========================================
      # 3. Kernel sources
      # ==========================================
      - name: Fetch kernel sources
        run: |
          set -euxo pipefail

          mkdir -p ws

          git clone \
            --branch "$KERNEL_BRANCH" \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750 \
            ws/common

          git clone \
            --branch "$KERNEL_BRANCH" \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-modules \
            ws/sm8750-modules

          git clone \
            --branch "$KERNEL_BRANCH" \
            https://github.com/crdroidandroid/android_kernel_oneplus_sm8750-devicetrees \
            ws/sm8750-devicetrees

          echo "================================"
          echo "KERNEL SOURCE INFORMATION"
          echo "================================"

          for repo in common sm8750-modules sm8750-devicetrees; do
            echo "=== $repo ==="
            git -C "ws/$repo" rev-parse HEAD
            git -C "ws/$repo" log -1 --format="%ci %s"
          done

          echo "=== Kernel version ==="

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
            ws/common/Makefile

          echo "=== Kernel source branch ==="

          git -C ws/common branch --show-current

      # ==========================================
      # 4. SUSFS integration
      # ==========================================
      - name: Integrate SUSFS
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            ws/susfs

          echo "=== SUSFS version ==="

          grep -m1 SUSFS_VERSION \
            ws/susfs/kernel_patches/include/linux/susfs.h

          cd ws/common

          # Copy SUSFS implementation
          cp ../susfs/kernel_patches/fs/susfs.c fs/

          cp ../susfs/kernel_patches/include/linux/susfs.h \
             ../susfs/kernel_patches/include/linux/susfs_def.h \
             include/linux/

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          echo "=== Applying SUSFS patch ==="

          patch --batch -p1 --forward \
            < ../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch

          if find . -name "*.rej" -print -quit | grep -q .; then
            echo "FATAL: SUSFS patch rejected"

            find . -name "*.rej" -exec sh -c \
              'echo "--- $1"; cat "$1"' _ {} \;

            exit 1
          fi

          echo "SUSFS integration completed"

      # ==========================================
      # 5. SukiSU builtin
      # ==========================================
      - name: Integrate SukiSU builtin
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          curl -fLSs \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            -o /tmp/sukisu-setup.sh

          bash /tmp/sukisu-setup.sh susfs-main

          test -d KernelSU
          test -f drivers/kernelsu/Kconfig

          echo "=== SukiSU HEAD ==="
          git -C KernelSU rev-parse HEAD

          echo "=== SukiSU Kconfig ==="
          grep -E '^config (KSU|KPM|KSU_SUSFS)' \
            KernelSU/kernel/Kconfig | head -40 || true
            

      

      - name: Check Native AVC Spoofing
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          echo "=== Check AVC spoofing symbols ==="

          grep -R -n -E \
            'susfs_is_avc_log_spoofing_enabled|susfs_ksu_sid|susfs_priv_app_sid|EnableAvcLogSpoofing' \
            KernelSU/kernel fs security include || true

          echo "=== Check AVC implementation ==="

          grep -n -A15 -B10 \
            'susfs_is_avc_log_spoofing_enabled' \
            security/selinux/avc.c || true

          echo "=== Check SUSFS implementation ==="

          grep -n -A10 -B5 \
            'susfs_is_avc_log_spoofing_enabled' \
            fs/susfs.c || true      

            
         
      # ==========================================
      # 5.1 Fix SukiSU SELinux compilation
      # ==========================================
      # ==========================================
      # 5.1 Fix SukiSU SELinux rules (old + new source)
      # ==========================================
      - name: Verify SukiSU SELinux rules
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          FILE=KernelSU/kernel/selinux/rules.c

          test -f "$FILE"

          echo "=== SELinux policy compatibility ==="

          grep -nE \
            'selinux_status_update_policyload|latest_granting' \
            "$FILE"

          if grep -n 'seqno0' "$FILE"; then
            echo "FATAL: stale seqno0 reference"
            exit 1
          fi

          if grep -n \
            'policydb->latest_granting = old_pol->latest_granting' \
            "$FILE"; then
            echo "FATAL: stale latest_granting assignment"
            exit 1
          fi

          grep -q \
            'pol->latest_granting = old_pol->latest_granting + 1' \
            "$FILE"

          echo "SELinux compatibility verified"
      
   
      # ==========================================
      # PRIORITY UID FILTER - compatibility fix
      # ==========================================
      - name: Configure PRIORITY_UID_FILTER
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("KernelSU")
          if not root.is_dir():
              raise SystemExit("FATAL: KernelSU directory missing")

          files = [
              p for p in root.rglob("*")
              if p.is_file()
              and (p.name == "Kconfig" or p.name.startswith("Kconfig."))
          ]

          if not files:
              raise SystemExit("FATAL: no KernelSU Kconfig files found")

          pattern = re.compile(
              r"(?m)^config KSU_SUSFS_PRIORITY_UID_FILTER\s*$"
          )

          matches = []
          susfs_matches = []

          for p in files:
              content = p.read_text(errors="replace")
              if pattern.search(content):
                  matches.append(p)
              if re.search(r"(?m)^config KSU_SUSFS\s*$", content):
                  susfs_matches.append(p)

          if len(matches) > 1:
              raise SystemExit(
                  "FATAL: duplicate PRIORITY_UID_FILTER definitions: "
                  + ", ".join(map(str, matches))
              )

          if matches:
              print("PRIORITY_UID_FILTER already defined:", matches[0])
          else:
              if len(susfs_matches) != 1:
                  raise SystemExit(
                      "FATAL: expected exactly one KSU_SUSFS definition, "
                      f"found {len(susfs_matches)}"
                  )

              p = susfs_matches[0]
              content = p.read_text()

              entry = """
          config KSU_SUSFS_PRIORITY_UID_FILTER
              bool "Enable priority uid filter"
              depends on KSU_SUSFS
              default y
              help
                Enable priority UID filtering for SUSFS.
          """

              # Insert immediately before the enclosing endmenu.
              start = content.find(
                  "config KSU_SUSFS\n"
              )
              end = content.find("\nendmenu", start)

              if start < 0 or end < 0:
                  raise SystemExit(
                      "FATAL: cannot locate SUSFS menu boundaries"
                  )

              content = content[:end] + "\n" + entry + content[end:]
              p.write_text(content)
              print("Added PRIORITY_UID_FILTER to", p)

          print("=== Final Kconfig definition ===")

          for p in files:
              content = p.read_text(errors="replace")
              if pattern.search(content):
                  print(p)
                  for line in content.splitlines():
                      if "KSU_SUSFS_PRIORITY_UID_FILTER" in line:
                          print(line)

          PY

          echo "=== Verify configuration symbol ==="

          grep -R -n -A6 \
            '^config KSU_SUSFS_PRIORITY_UID_FILTER$' \
            KernelSU --include='Kconfig*'

      
      # ==========================================
      # 7. Configure kernel
      # ==========================================
      - name: Configure kernel
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          cp "${{ github.workspace }}/device.config" .config

          echo "=== Remove conflicting definitions ==="

          for c in \
            KSU \
            KPM \
            KSU_SUSFS \
            KSU_SUSFS_PRIORITY_UID_FILTER \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL; do

            sed -i \
              -e "/^CONFIG_${c}=/d" \
              -e "/^# CONFIG_${c} is not set$/d" \
              .config
          done

          echo "=== Enable required dependencies ==="

          cat >> .config <<'EOF'

          # ======================================
          # Architecture and security
          # ======================================

          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_EXT4_FS=y

          # ======================================
          # Kernel debugging and symbols
          # ======================================

          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # ======================================
          # SukiSU Ultra
          # ======================================

          CONFIG_KSU=y
          CONFIG_KPM=y

          # ======================================
          # SUSFS
          # ======================================

          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y

          EOF

          # Avoid automatic git suffix changes
          sed -i \
            's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' \
            .config

          echo "=== Resolve Kconfig dependencies ==="

          make olddefconfig

          echo "=== Final configuration ==="

          for c in \
            64BIT \
            SECURITY \
            SECURITY_SELINUX \
            EXT4_FS \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL \
            KSU \
            KPM \
            KSU_SUSFS \
            KSU_SUSFS_PRIORITY_UID_FILTER; do

            if ! grep -qx "CONFIG_${c}=y" .config; then
              echo "FATAL: CONFIG_${c} is not enabled"

              grep -E \
                "^CONFIG_${c}=|^# CONFIG_${c} is not set" \
                .config || true

              exit 1
            fi

            echo "OK: CONFIG_${c}=y"
          done

          echo "=== Verify KPM dependencies ==="

          grep -E \
            '^CONFIG_(KSU|KPM|64BIT|KALLSYMS|KALLSYMS_ALL|DEBUG_KERNEL)=y$' \
            .config

          echo "=== Verify SUSFS configuration ==="

          grep -E \
            '^CONFIG_KSU_SUSFS.*=y$' \
            .config || true

          echo "=== Verify KPROBES status ==="

          grep -E \
            '^CONFIG_KPROBES=|^# CONFIG_KPROBES is not set' \
            .config || true

          echo "=== Kernel release ==="

          make -s kernelrelease

      # ==========================================
      # 8. Kernel source compatibility
      # ==========================================
      - name: Check kernel compatibility
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          VERSION=$(make -s kernelversion)

          echo "Kernel version: $VERSION"

          case "$VERSION" in
            6.6.*)
              echo "OK: Linux 6.6 kernel family"
              ;;
            *)
              echo "FATAL: unexpected kernel version"
              exit 1
              ;;
          esac

          echo "=== LSM structure ==="

          grep -R -n 'struct lsm_blob_sizes' \
            include/linux security/selinux || true

          echo "=== Kernel source commit ==="

          git log -1 --format='%H%n%ci%n%s'

          echo "=== Kernel configuration ==="

          grep -E \
            'CONFIG_(KSU|KPM|KSU_SUSFS|KALLSYMS_ALL)=' \
            .config

      # ==========================================
      # 9. Headers
      # ==========================================
      - name: Install headers
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          make headers_install

          test -f usr/include/linux/unistd.h

          echo "UAPI headers installed"

      # ==========================================
      # 10. Build Image
      # ==========================================
      - name: Build kernel Image
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -uo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          JOBS=$(nproc)

          echo "================================"
          echo "BUILD KERNEL"
          echo "================================"

          echo "CPU jobs: $JOBS"
          echo "KPM requested: ${{ inputs.enable_kpm }}"

          if make -j"$JOBS" Image; then
            echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
            echo "KPM_STATUS=ENABLED" >> "$GITHUB_ENV"

          else
            echo "Initial build failed"

            if [ "${{ inputs.enable_kpm }}" != "true" ]; then
              echo "KPM fallback not requested"
              exit 1
            fi

            echo "================================"
            echo "RETRY WITHOUT KPM"
            echo "================================"

            sed -i \
              -e '/^CONFIG_KPM=/d' \
              -e '/^# CONFIG_KPM is not set/d' \
              .config

            echo "# CONFIG_KPM is not set" >> .config

            make olddefconfig

            if grep -qx 'CONFIG_KPM=y' .config; then
              echo "FATAL: KPM could not be disabled"
              exit 1
            fi

            # Clean partial objects but preserve configuration
            make clean

            if ! make -j"$JOBS" Image; then
              echo "FATAL: kernel build failed without KPM"
              exit 1
            fi

            echo "KERNEL_BUILD=SUCCESS" >> "$GITHUB_ENV"
            echo "KPM_STATUS=DISABLED_FALLBACK" >> "$GITHUB_ENV"
          fi

          test -s arch/arm64/boot/Image

          echo "=== Image size ==="
          ls -lh arch/arm64/boot/Image

      
      # ==========================================
      # 11. Verify kernel features
      # ==========================================
      - name: Verify kernel features
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          IMG=arch/arm64/boot/Image

          test -s "$IMG"
          test -s vmlinux

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          echo "================================"
          echo "KERNEL VERIFICATION"
          echo "================================"

          echo "=== Kernel release ==="
          make -s kernelrelease

          echo "=== Required configurations ==="

          for c in \
            64BIT \
            SECURITY \
            SECURITY_SELINUX \
            EXT4_FS \
            DEBUG_KERNEL \
            KALLSYMS \
            KALLSYMS_ALL \
            KSU \
            KSU_SUSFS \
            KSU_SUSFS_PRIORITY_UID_FILTER; do

            grep -qx "CONFIG_${c}=y" .config || {
              echo "FATAL: CONFIG_${c} missing"
              exit 1
            }

            echo "OK: $c"
          done

          echo "=== KPM status ==="

          if grep -qx 'CONFIG_KPM=y' .config; then
            echo "KPM ENABLED"
          else
            echo "KPM DISABLED (fallback)"
          fi

          echo "=== SUSFS objects ==="

          test -s fs/susfs.o
          echo "OK: fs/susfs.o"

          echo "=== KernelSU objects ==="

          test -d drivers/kernelsu

          find drivers/kernelsu \
            -name '*.o' \
            -type f | head -30

          echo "=== SUSFS symbols ==="

          nm -a vmlinux | grep -E \
            'susfs_parse_priority_app_strings|susfs_set_priority_uid_filter|susfs_add_sus_path' \
            || true

          echo "=== Kernel image ==="

          file "$IMG"
          ls -lh "$IMG"
          sha256sum "$IMG"

          echo "=== Kernel config summary ==="

          grep -E \
            '^CONFIG_(64BIT|SECURITY|SECURITY_SELINUX|EXT4_FS|DEBUG_KERNEL|KALLSYMS|KALLSYMS_ALL|KSU|KPM|KSU_SUSFS.*)=y$' \
            .config

          echo "=== Verification completed ==="

      # ==========================================
      # 12. Build information
      # ==========================================
      - name: Generate build information
        working-directory: ${{ github.workspace }}/ws/common
        run: |
          set -euxo pipefail

          export PATH="$HOME/llvm/bin:$PATH"
          export ARCH=arm64
          export LLVM=1

          cd "${{ github.workspace }}"

          {
            echo "Device: hummer / PKR110"
            echo "ROM: crDroid 13.1"
            echo "Android: 17"
            echo "Kernel branch: $KERNEL_BRANCH"
            echo "Kernel release: $(make -s -C ws/common kernelrelease)"
            echo "Kernel commit: $(git -C ws/common rev-parse HEAD)"
            echo "Modules commit: $(git -C ws/sm8750-modules rev-parse HEAD)"
            echo "Devicetree commit: $(git -C ws/sm8750-devicetrees rev-parse HEAD)"
            echo "SukiSU commit: $(git -C ws/common/KernelSU rev-parse HEAD)"
            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "LLVM: $LLVM_VERSION"
            echo "KPM status: $KPM_STATUS"
            echo "Build: $KERNEL_BUILD"
            echo "Date UTC: $(date -u)"
            echo ""
            echo "=== Kernel config ==="
            grep -E '^CONFIG_(KSU|KPM|KSU_SUSFS|KALLSYMS_ALL)=' \
              ws/common/.config || true
            echo ""
            echo "=== Image SHA256 ==="
            sha256sum ws/common/arch/arm64/boot/Image
          } > BUILD-INFO.txt

          cat BUILD-INFO.txt

      # ==========================================
      # 13. Package AnyKernel3
      # ==========================================
      - name: Package AnyKernel3
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            ak3

          cp ws/common/arch/arm64/boot/Image ak3/Image

          cd ak3

          # Device identification
          sed -i \
            's/^device.name1=.*/device.name1=hummer/' \
            anykernel.sh

          sed -i \
            's/^device.name2=.*/device.name2=PKR110/' \
            anykernel.sh

          sed -i \
            's/^device.name3=.*/device.name3=/' \
            anykernel.sh

          sed -i \
            's/^device.name4=.*/device.name4=/' \
            anykernel.sh

          sed -i \
            's/^device.name5=.*/device.name5=/' \
            anykernel.sh

          # Boot partition
          sed -i \
            's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' \
            anykernel.sh

          # A/B device
          sed -i \
            's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' \
            anykernel.sh

          # Remove repository metadata
          rm -rf .git

          zip -r9 \
            "${{ github.workspace }}/AK3-hummer-builtin-susfs.zip" \
            .

          cd "${{ github.workspace }}"

          ls -lh AK3-hummer-builtin-susfs.zip

      # ==========================================
      # 14. Upload
      # ==========================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AK3-hummer-crDroid13.1-builtin-susfs
          path: |
            AK3-hummer-builtin-susfs.zip
            BUILD-INFO.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
